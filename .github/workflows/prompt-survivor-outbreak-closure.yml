name: Prompt Survivor Outbreak Closure

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/app/CombatGameMain.gd'
      - 'game/scripts/app/EnvironmentalPressureGameMain.gd'
      - 'game/scripts/simulation/population/**'
      - 'game/scripts/simulation/infected/DynamicInfectedCohortService.gd'
      - 'game/scripts/ci/PromptSurvivorOutbreakClosureSmoke.gd'
      - '.github/workflows/prompt-survivor-outbreak-closure.yml'
      - 'README_CONTEXT.md'
  workflow_dispatch:

jobs:
  survivor-outbreak-closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Prepare Godot project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify production survivor NPC and outbreak closure
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptSurvivorOutbreakClosureSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prompt-survivor-outbreak-closure.log"
          grep -q 'PROMPT_SURVIVOR_OUTBREAK_CLOSURE_SMOKE: PASS' "$RUNNER_TEMP/prompt-survivor-outbreak-closure.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prompt-survivor-outbreak-closure.log"; then exit 1; fi
