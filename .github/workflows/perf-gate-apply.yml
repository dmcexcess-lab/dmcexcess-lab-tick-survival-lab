name: Apply performance gate consumer patch

on:
  push:
    branches: [perf-architecture-gate]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply performance consumer patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf-architecture-gate
          fetch-depth: 0

      - name: Apply bounded consumer patch
        shell: bash
        run: |
          python3 - <<'PY'
