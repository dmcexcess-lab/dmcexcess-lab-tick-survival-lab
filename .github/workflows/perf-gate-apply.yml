              '''func _on_world_changed(change: WorldChange) -> void:
    if not _view_valid or change == null or (_world != null and _world.is_change_batch_active()):
        return
    if _change_touches_visible_geometry(change):
        refresh(&"world_geometry_changed")

func _on_world_batch_changed(batch: WorldChangeBatch) -> void:
    if not _view_valid or batch == null:
        return
    var visible := Rect2i(_visible_origin, _visible_size)
    if batch.terrain_changed:
        var terrain_dirty: Rect2i = batch.terrain_dirty_bounds()
        if terrain_dirty.size.x > 0 and terrain_dirty.size.y > 0 and visible.intersects(terrain_dirty):
            refresh(&"world_geometry_batch_changed")
            return
    if batch.channel_changed(Layers.Channel.STRUCTURE):
        var structure_dirty: Rect2i = batch.dirty_rect_for_channel(Layers.Channel.STRUCTURE)
        if structure_dirty.size.x > 0 and structure_dirty.size.y > 0 and visible.intersects(structure_dirty):
            refresh(&"world_geometry_batch_changed")

func _change_touches_visible_geometry(change: WorldChange) -> bool:
    var visible := Rect2i(_visible_origin, _visible_size)
    match change.kind:
        ChangeClass.Kind.TERRAIN_SET, ChangeClass.Kind.TERRAIN_REMOVED:
            return visible.has_point(change.terrain_cell)
        ChangeClass.Kind.TERRAIN_BATCH_SET:
            if change.terrain_rect.size.x > 0 and change.terrain_rect.size.y > 0:
                return visible.intersects(change.terrain_rect)
            return _cells_touch_visible(change.terrain_cells)
        ChangeClass.Kind.PLACEMENT_SET, ChangeClass.Kind.PLACEMENT_REMOVED, ChangeClass.Kind.ENTITY_REMOVED:
            if not change.affects_channel(Layers.Channel.STRUCTURE):
                return false
            return _cells_touch_visible(change.before_cells) or _cells_touch_visible(change.after_cells)
        _:
            return false

func _cells_touch_visible(cells: Array[Vector2i]) -> bool:
    var visible := Rect2i(_visible_origin, _visible_size)
    for cell: Vector2i in cells:
        if visible.has_point(cell):
            return true
    return false

func _on_world_reset() -> void:
''')

