          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {actual}\n--- needle ---\n{old}")
              p.write_text(s.replace(old, new, count))

