name: Canonical HUD Facing Inspection contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-hud-facing-inspection-contract
  cancel-in-progress: true

jobs:
  canonical-hud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HUD boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/15_CANONICAL_HUD_FACING_INSPECTION.md
          test -f game/scripts/ui/FacingInspectionQuery.gd
          test -f game/scripts/ui/ActorStatusSummaryQuery.gd
          test -f game/scripts/ui/CanonicalStatusHud.gd
          test -f game/scripts/ci/CanonicalHudSmoke.gd
          grep -q 'Status: \*\*APPROVED\*\*\|Status: \*\*IMPLEMENTED\*\*' SYSTEM_DESIGNS/15_CANONICAL_HUD_FACING_INSPECTION.md
          grep -q 'CanonicalStatusHud.gd' game/main.tscn
          ! grep -R -q 'scripts/reboot' game/scripts/ui/FacingInspectionQuery.gd game/scripts/ui/ActorStatusSummaryQuery.gd game/scripts/ui/CanonicalStatusHud.gd
          ! grep -q '_process' game/scripts/ui/CanonicalStatusHud.gd
          ! grep -q 'WorldMutationService' game/scripts/ui/FacingInspectionQuery.gd game/scripts/ui/ActorStatusSummaryQuery.gd game/scripts/ui/CanonicalStatusHud.gd
          ! grep -q 'MutationService' game/scripts/ui/FacingInspectionQuery.gd game/scripts/ui/ActorStatusSummaryQuery.gd game/scripts/ui/CanonicalStatusHud.gd
          ! grep -q 'simulation/movement' game/scripts/ui/FacingInspectionQuery.gd game/scripts/ui/ActorStatusSummaryQuery.gd game/scripts/ui/CanonicalStatusHud.gd
          ! grep -q 'scripts/render' game/scripts/ui/FacingInspectionQuery.gd game/scripts/ui/ActorStatusSummaryQuery.gd game/scripts/ui/CanonicalStatusHud.gd
          ! grep -q 'perception' game/scripts/ui/FacingInspectionQuery.gd game/scripts/ui/ActorStatusSummaryQuery.gd game/scripts/ui/CanonicalStatusHud.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Health regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHealthSmoke.gd 2>&1 | tee "$RUNNER_TEMP/health.log"
          grep -q 'ACTOR_HEALTH_SMOKE_OK' "$RUNNER_TEMP/health.log"

      - name: Needs regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorNeedsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/needs.log"
          grep -q 'ACTOR_NEEDS_SMOKE_OK' "$RUNNER_TEMP/needs.log"

      - name: Carry regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorCarrySmoke.gd 2>&1 | tee "$RUNNER_TEMP/carry.log"
          grep -q 'ACTOR_CARRY_SMOKE_OK' "$RUNNER_TEMP/carry.log"

      - name: Moodlets regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorMoodletsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/moodlets.log"
          grep -q 'ACTOR_MOODLETS_SMOKE_OK' "$RUNNER_TEMP/moodlets.log"

      - name: Canonical walking demo regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalDemoSmoke.gd 2>&1 | tee "$RUNNER_TEMP/demo.log"
          grep -q 'CANONICAL_DEMO_SMOKE_OK' "$RUNNER_TEMP/demo.log"

      - name: Canonical HUD integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalHudSmoke.gd 2>&1 | tee "$RUNNER_TEMP/hud.log"
          grep -q 'CANONICAL_HUD_SMOKE_OK' "$RUNNER_TEMP/hud.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/hud.log"; then exit 1; fi

      - name: Canonical demo startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
