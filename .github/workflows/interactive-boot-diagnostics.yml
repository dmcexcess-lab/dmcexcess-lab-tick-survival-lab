name: Interactive Procedural Boot Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interactive-procedural-boot-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactive-boot-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"

      - name: Run interactive procedural seed boot matrix
        id: boot_matrix
        shell: bash
        run: |
          set +e
          failed=0
          for seed in 1 7 29 101 997 20001 28028 104729 524287 999983 123456789 2147483629; do
            log="$RUNNER_TEMP/interactive-seed-$seed.log"
            echo "=== seed=$seed ==="
            TICK_LAB_WORLD_SEED="$seed" ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 10 >"$log" 2>&1
            status=$?
            cat "$log"
            if [ "$status" -ne 0 ]; then
              echo "BOOT_DIAGNOSTIC_FAILED seed=$seed reason=godot_exit status=$status"
              failed=1
            fi
            if ! grep -q 'CANONICAL_DEMO_BOOT_OK' "$log"; then
              echo "BOOT_DIAGNOSTIC_FAILED seed=$seed reason=missing_boot_marker"
              failed=1
            fi
            if grep -Eqi 'CANONICAL_DEMO_BOOT_FAILED|SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then
              echo "BOOT_DIAGNOSTIC_FAILED seed=$seed reason=runtime_or_script_error"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload interactive boot logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-procedural-boot-logs
          path: |
            ${{ runner.temp }}/interactive-seed-*.log
            ${{ runner.temp }}/import.log
          if-no-files-found: error
