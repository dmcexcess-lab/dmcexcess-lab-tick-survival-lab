name: Actor Stats Domains contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actor-stats-domains-contract
  cancel-in-progress: true

jobs:
  actor-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 13 source boundaries
        shell: bash
        run: |
          set -euxo pipefail
          for f in \
            SYSTEM_DESIGNS/13A_ACTOR_HEALTH_INJURY.md \
            SYSTEM_DESIGNS/13B_ACTOR_NEEDS_REST.md \
            SYSTEM_DESIGNS/13C_ACTOR_SKILLS.md \
            SYSTEM_DESIGNS/13D_ITEM_PHYSICAL_PROPERTIES.md \
            SYSTEM_DESIGNS/13E_ACTOR_CARRY_ENCUMBRANCE.md \
            SYSTEM_DESIGNS/13F_ACTOR_MOODLETS.md \
            game/scripts/simulation/actors/health/ActorInjuryRecord.gd \
            game/scripts/simulation/actors/health/ActorHealthState.gd \
            game/scripts/simulation/actors/needs/ActorNeedsState.gd \
            game/scripts/simulation/actors/needs/ActorNeedsMobilityModifierProvider.gd \
            game/scripts/simulation/actors/skills/ActorSkillCatalog.gd \
            game/scripts/simulation/actors/skills/ActorSkillState.gd \
            game/scripts/simulation/items/properties/ItemPhysicalProfile.gd \
            game/scripts/simulation/items/properties/ItemPhysicalPropertyCatalog.gd \
            game/scripts/simulation/items/properties/ItemWeightQuery.gd \
            game/scripts/simulation/actors/carry/ActorCarryState.gd \
            game/scripts/simulation/actors/carry/ActorCarryQuery.gd \
            game/scripts/simulation/actors/carry/ActorCarryMobilityModifierProvider.gd \
            game/scripts/simulation/actors/moodlets/ActorMoodlet.gd \
            game/scripts/simulation/actors/moodlets/ActorMoodletService.gd; do
            test -f "$f"
          done
          ! grep -R -q 'scripts/reboot' game/scripts/simulation/actors/health game/scripts/simulation/actors/needs game/scripts/simulation/actors/skills game/scripts/simulation/actors/carry game/scripts/simulation/actors/moodlets game/scripts/simulation/items/properties
          ! grep -R -q 'scripts/render' game/scripts/simulation/actors/health game/scripts/simulation/actors/needs game/scripts/simulation/actors/skills game/scripts/simulation/actors/carry game/scripts/simulation/actors/moodlets game/scripts/simulation/items/properties
          ! grep -R -q 'scripts/art' game/scripts/simulation/actors/health game/scripts/simulation/actors/needs game/scripts/simulation/actors/skills game/scripts/simulation/actors/carry game/scripts/simulation/actors/moodlets game/scripts/simulation/items/properties
          ! grep -R -q '_process(' game/scripts/simulation/actors/health game/scripts/simulation/actors/needs game/scripts/simulation/actors/skills game/scripts/simulation/actors/carry game/scripts/simulation/actors/moodlets game/scripts/simulation/items/properties
          ! grep -R -q 'scripts/simulation/inventory' game/scripts/simulation/items/properties
          ! grep -R -q 'scripts/simulation/actors/equipment' game/scripts/simulation/items/properties
          ! grep -R -q 'scripts/simulation/items/transfer' game/scripts/simulation/actors/carry game/scripts/simulation/items/properties

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Persistent WHAT regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/WorldStateSmoke.gd 2>&1 | tee "$RUNNER_TEMP/world.log"
          grep -q 'WORLD_STATE_SMOKE_OK' "$RUNNER_TEMP/world.log"

      - name: Actor locomotion regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorLocomotionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/locomotion.log"
          grep -q 'ACTOR_LOCOMOTION_SMOKE_OK' "$RUNNER_TEMP/locomotion.log"

      - name: Hand equipment regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHandEquipmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/hands.log"
          grep -q 'ACTOR_HAND_EQUIPMENT_SMOKE_OK' "$RUNNER_TEMP/hands.log"

      - name: Inventory containment regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/InventoryContainmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/inventory.log"
          grep -q 'INVENTORY_CONTAINMENT_SMOKE_OK' "$RUNNER_TEMP/inventory.log"

      - name: Actor Health contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHealthSmoke.gd 2>&1 | tee "$RUNNER_TEMP/health.log"
          grep -q 'ACTOR_HEALTH_SMOKE_OK' "$RUNNER_TEMP/health.log"

      - name: Actor Needs contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorNeedsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/needs.log"
          grep -q 'ACTOR_NEEDS_SMOKE_OK' "$RUNNER_TEMP/needs.log"

      - name: Actor Skills contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorSkillsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/skills.log"
          grep -q 'ACTOR_SKILLS_SMOKE_OK' "$RUNNER_TEMP/skills.log"

      - name: Item Physical Properties contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ItemPhysicalPropertiesSmoke.gd 2>&1 | tee "$RUNNER_TEMP/item-properties.log"
          grep -q 'ITEM_PHYSICAL_PROPERTIES_SMOKE_OK' "$RUNNER_TEMP/item-properties.log"

      - name: Actor Carry contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorCarrySmoke.gd 2>&1 | tee "$RUNNER_TEMP/carry.log"
          grep -q 'ACTOR_CARRY_SMOKE_OK' "$RUNNER_TEMP/carry.log"

      - name: Actor Moodlets contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorMoodletsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/moodlets.log"
          grep -q 'ACTOR_MOODLETS_SMOKE_OK' "$RUNNER_TEMP/moodlets.log"
