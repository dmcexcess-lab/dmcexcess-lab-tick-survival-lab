name: Build and deploy Tick Survival Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate transition source
        shell: bash
        run: |
          set -euxo pipefail
          test -f README.md
          test -f PROJECT_NORTH_STAR.md
          test -f DESIGN_DECISIONS.md
          test -f README_CONTEXT.md
          test -f README_SOPS.md
          test -f DESIGN_WORKFLOW.md
          test -f SYSTEM_DESIGNS/README.md
          test -f SYSTEM_DESIGNS/00_FOUNDATION_WHERE_WHAT_WHEN.md
          test -f SYSTEM_DESIGNS/00A_SPATIAL_MODEL.md
          test -f MODULAR_REBUILD_MASTER_DESIGN.md
          test -f REBOOT_CORE.md
          test -f PREFAB_WORKSHOP.md
          grep -q 'Ultima-style turn-based mini Zomboid' PROJECT_NORTH_STAR.md
          grep -q 'reduced complexity, not reduced consequence or mood' PROJECT_NORTH_STAR.md
          grep -q 'Persistent open world replaces separate-raid world as foundation' DESIGN_DECISIONS.md
          grep -q 'DESCRIBE -> APPROVE -> IMPLEMENT -> VERIFY' DESIGN_WORKFLOW.md
          grep -q 'One major system per implementation slice' README_SOPS.md
          grep -q 'Main is composition, not implementation' MODULAR_REBUILD_MASTER_DESIGN.md
          grep -q 'Status: \*\*APPROVED' SYSTEM_DESIGNS/00A_SPATIAL_MODEL.md
          grep -q '1763958f44eb7f855fd49944c00d1ffe608c0abe' MODULAR_REBUILD_MASTER_DESIGN.md
          test -f game/project.godot
          test -f game/export_presets.cfg
          test -f game/main.tscn
          test -f game/assets/tactical_atlas.svg
          test -f game/assets/clutter_atlas.svg
          test -f game/assets/world_art_atlas.svg
          test -f game/assets/building_props_atlas.svg
          test -f game/assets/final_environment_surfaces_atlas.svg
          test -f game/assets/final_environment_props_atlas.svg
          test -f game/assets/player_north.svg
          test -f game/assets/player_east.svg
          test -f game/assets/player_south.svg
          test -f game/assets/player_west.svg
          # First canonical modular foundation slice: WHERE / Spatial Model.
          test -f game/scripts/foundation/spatial/SpatialFacing.gd
          test -f game/scripts/foundation/spatial/SpatialFootprint.gd
          test -f game/scripts/foundation/spatial/SpatialStructureGeometry.gd
          test -f game/scripts/foundation/spatial/SpatialLayer.gd
          test -f game/scripts/foundation/spatial/SpatialModel.gd
          test -f game/scripts/ci/SpatialModelSmoke.gd
          grep -q 'class_name SpatialFacing' game/scripts/foundation/spatial/SpatialFacing.gd
          grep -q 'class_name SpatialFootprint' game/scripts/foundation/spatial/SpatialFootprint.gd
          grep -q 'class_name SpatialStructureGeometry' game/scripts/foundation/spatial/SpatialStructureGeometry.gd
          grep -q 'class_name SpatialLayer' game/scripts/foundation/spatial/SpatialLayer.gd
          grep -q 'class_name SpatialModel' game/scripts/foundation/spatial/SpatialModel.gd
          # Current live reference remains the deprecated clean-reboot runtime until
          # the modular replacement lands. Keep proving it still builds while the
          # modular foundation is introduced beside it.
          test -f game/scripts/reboot/RebootArt.gd
          test -f game/scripts/reboot/RebootSiteGenerator.gd
          test -f game/scripts/reboot/RebootPlayer.gd
          test -f game/scripts/reboot/RebootMain.gd
          test -f game/scripts/reboot/RebootPrefabLibrary.gd
          test -f game/scripts/reboot/RebootPrefabEditor.gd
          test -f game/scripts/ci/RebootSmoke.gd
          test -f game/scripts/ci/RebootPrefabSmoke.gd
          grep -q 'class_name RebootArt' game/scripts/reboot/RebootArt.gd
          grep -q 'class_name RebootSiteGenerator' game/scripts/reboot/RebootSiteGenerator.gd
          grep -q '"rural_road"' game/scripts/reboot/RebootSiteGenerator.gd
          grep -q 'class_name RebootPlayer' game/scripts/reboot/RebootPlayer.gd
          grep -q 'class_name RebootMain' game/scripts/reboot/RebootMain.gd
          grep -q 'class_name RebootPrefabLibrary' game/scripts/reboot/RebootPrefabLibrary.gd
          grep -q 'class_name RebootPrefabEditor' game/scripts/reboot/RebootPrefabEditor.gd
          grep -q 'run/main_scene="res://main.tscn"' game/project.godot
          ! grep -q 'autoload' game/project.godot

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Spatial model contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/SpatialModelSmoke.gd 2>&1 | tee "$RUNNER_TEMP/spatial-smoke.log"
          grep -q 'SPATIAL_MODEL_SMOKE_OK' "$RUNNER_TEMP/spatial-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/spatial-smoke.log"; then exit 1; fi

      - name: Reboot reference core smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/RebootSmoke.gd 2>&1 | tee "$RUNNER_TEMP/reboot-smoke.log"
          grep -q 'REBOOT_CORE_SMOKE_OK' "$RUNNER_TEMP/reboot-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/reboot-smoke.log"; then exit 1; fi

      - name: Prefab workshop reference smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/RebootPrefabSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prefab-smoke.log"
          grep -q 'REBOOT_PREFAB_SMOKE_OK' "$RUNNER_TEMP/prefab-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prefab-smoke.log"; then exit 1; fi

      - name: Startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'REBOOT_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --export-release Web "$GITHUB_WORKSPACE/build/web/index.html" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/export.log"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/build/web/.nojekyll"

      - name: Configure / enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
