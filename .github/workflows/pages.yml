name: Build and deploy Tick Survival Lab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical source
        shell: bash
        run: |
          set -euxo pipefail
          test -f README.md
          test -f README_CONTEXT.md
          test -f README_SOPS.md
          test -f DESIGN.md
          test -f ROADMAP.md
          test -f FIRST_FIRE_REUSE.md
          test -f game/project.godot
          test -f game/export_presets.cfg
          test -f game/main.tscn
          test -f game/assets/tactical_atlas.svg
          test -f game/scripts/TacticalMapGenerator.gd
          test -f game/scripts/LocalWorldState.gd
          test -f game/scripts/TickScheduler.gd
          test -f game/scripts/PlayerActor.gd
          test -f game/scripts/TimingDummy.gd
          test -f game/scripts/TacticalLighting.gd
          test -f game/scripts/TacticalSound.gd
          test -f game/scripts/TacticalTiles.gd
          test -f game/scripts/TacticalPerception.gd
          test -f game/scripts/MapPreview.gd
          test -f game/scripts/ci/MapSmoke.gd
          test -f game/scripts/ci/TickSmoke.gd
          test -f game/scripts/ci/EnvironmentSmoke.gd
          test -f game/scripts/ci/PerceptionSmoke.gd
          grep -q 'class_name TacticalMapGenerator' game/scripts/TacticalMapGenerator.gd
          grep -q 'class_name TickScheduler' game/scripts/TickScheduler.gd
          grep -q 'class_name TimingDummy' game/scripts/TimingDummy.gd
          grep -q 'class_name TacticalLighting' game/scripts/TacticalLighting.gd
          grep -q 'class_name TacticalSound' game/scripts/TacticalSound.gd
          grep -q 'class_name TacticalTiles' game/scripts/TacticalTiles.gd
          grep -q 'class_name TacticalPerception' game/scripts/TacticalPerception.gd
          grep -q 'run/main_scene="res://main.tscn"' game/project.godot

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Map architecture smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/MapSmoke.gd 2>&1 | tee "$RUNNER_TEMP/map-smoke.log"
          grep -q 'TICK_SURVIVAL_MAP_SMOKE_OK' "$RUNNER_TEMP/map-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/map-smoke.log"; then exit 1; fi

      - name: Tick scheduler smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/TickSmoke.gd 2>&1 | tee "$RUNNER_TEMP/tick-smoke.log"
          grep -q 'TICK_SURVIVAL_SCHEDULER_SMOKE_OK' "$RUNNER_TEMP/tick-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/tick-smoke.log"; then exit 1; fi

      - name: Environment rules smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/EnvironmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/environment-smoke.log"
          grep -q 'TICK_SURVIVAL_ENVIRONMENT_SMOKE_OK' "$RUNNER_TEMP/environment-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/environment-smoke.log"; then exit 1; fi

      - name: Perception smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PerceptionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception-smoke.log"
          grep -q 'TICK_SURVIVAL_PERCEPTION_SMOKE_OK' "$RUNNER_TEMP/perception-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception-smoke.log"; then exit 1; fi

      - name: Startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'MAP_BOOTSTRAP_VALIDATION_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Export Web build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/web"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --export-release Web "$GITHUB_WORKSPACE/build/web/index.html" 2>&1 | tee "$RUNNER_TEMP/export.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/export.log"; then exit 1; fi
          touch "$GITHUB_WORKSPACE/build/web/.nojekyll"

      - name: Configure / enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
