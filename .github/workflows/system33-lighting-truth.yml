name: System 33 lighting truth

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: system33-lighting-truth
  cancel-in-progress: true

jobs:
  verify:
    name: verify/system33-lighting-truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate truthful source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f game/scripts/ci/System33LightingTruthSmoke.gd
          test -f game/scripts/ci/RoomLightingPowerSmoke.gd
          test -f game/scripts/ci/System33PowerInfrastructureSmoke.gd
          test -f game/scripts/simulation/utilities/UtilityPowerInfrastructureMaterializer.gd
          test -f game/scripts/render/PowerLinePresentationRenderer.gd
          grep -q 'entity_ids_of_type' game/scripts/foundation/world/WorldState.gd
          grep -q 'item.tool.flashlight' game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          grep -q 'prop.traffic_light' game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          grep -q 'prop.gas_sign' game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          grep -q 'world_tick_advanced' game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          grep -q 'fixture.room_light' game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          grep -q 'fixture.room_light' game/scripts/generation/buildings/GeneratedBuildingMaterializer.gd
          grep -q 'prop.utility_pole_wood' game/scripts/simulation/utilities/UtilityPowerInfrastructureMaterializer.gd
          grep -q 'prop.utility_pole_transformer' game/scripts/simulation/utilities/UtilityPowerInfrastructureMaterializer.gd
          grep -q 'presentation_glow_scale' game/scripts/simulation/lighting/LightEmitterProfile.gd
          test ! -f game/scripts/demo/DemoLightingSourceAdapter.gd
          ! grep -R -q 'DemoLightingSourceAdapter\|_demo_lighting_sources' game/scripts/app game/main.tscn
          ! grep -R -q '_process' game/scripts/simulation/utilities
          ! grep -R -q 'Timer.new' game/scripts/simulation/utilities

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Truthful lighting, room-light and power-infrastructure smokes
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'System33LightingTruthSmoke.gd:SYSTEM33_LIGHTING_TRUTH_SMOKE_OK' \
            'RoomLightingPowerSmoke.gd:ROOM_LIGHTING_POWER_SMOKE_OK' \
            'System33PowerInfrastructureSmoke.gd:SYSTEM33_POWER_INFRASTRUCTURE_SMOKE_OK'; do
            script=${spec%%:*}
            marker=${spec#*:}
            log="$RUNNER_TEMP/${script%.gd}.log"
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script "res://scripts/ci/$script" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then exit 1; fi
          done

      - name: Protected lighting and responsiveness regressions
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'PhysicalLightingSmoke.gd:PHYSICAL_LIGHTING_SMOKE_OK' \
            'PlayerInputResponsivenessSmoke.gd:PLAYER_INPUT_RESPONSIVENESS_SMOKE_OK'; do
            script=${spec%%:*}
            marker=${spec#*:}
            log="$RUNNER_TEMP/${script%.gd}.log"
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script "res://scripts/ci/$script" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then exit 1; fi
          done

      - name: Canonical startup regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 6 2>&1 | tee "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Assertion failed|ObjectDB instances leaked at exit|resources still in use at exit' "$RUNNER_TEMP/startup.log"; then exit 1; fi
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"

      - name: Publish exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system33-lighting-truth","description":"Truthful utility lighting and power infrastructure","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
