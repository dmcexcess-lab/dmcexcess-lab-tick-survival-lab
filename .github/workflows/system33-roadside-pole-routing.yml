name: System 33 roadside pole routing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: system33-roadside-pole-routing
  cancel-in-progress: true

jobs:
  verify:
    name: verify/system33-roadside-pole-routing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate roadside pole source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f game/scripts/simulation/utilities/UtilityLocalPowerTopologyPlanner.gd
          test -f game/scripts/simulation/utilities/NeighborhoodPowerInfrastructureMaterializer.gd
          test -f game/scripts/ci/System33RoadsidePoleRoutingSmoke.gd
          grep -q 'pole_exclusion_cells' game/scripts/simulation/utilities/UtilityLocalPowerTopologyPlanner.gd
          grep -q 'ROAD_SIDE_HOLD_POLES' game/scripts/simulation/utilities/NeighborhoodPowerInfrastructureMaterializer.gd
          grep -q '_find_roadside_available' game/scripts/simulation/utilities/NeighborhoodPowerInfrastructureMaterializer.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Roadside pole routing regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/System33RoadsidePoleRoutingSmoke.gd 2>&1 | tee "$RUNNER_TEMP/roadside-poles.log"
          grep -q 'SYSTEM33_ROADSIDE_POLE_ROUTING_SMOKE_OK' "$RUNNER_TEMP/roadside-poles.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Assertion failed' "$RUNNER_TEMP/roadside-poles.log"; then exit 1; fi

      - name: Protected System 33 and startup regressions
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'System33PowerInfrastructureSmoke.gd:SYSTEM33_POWER_INFRASTRUCTURE_SMOKE_OK' \
            'System33PowerWaterSmoke.gd:SYSTEM33_POWER_WATER_SMOKE_OK' \
            'PerformanceArchitectureSmoke.gd:PERFORMANCE_ARCHITECTURE_SMOKE_OK' \
            'PlayerInputResponsivenessSmoke.gd:PLAYER_INPUT_RESPONSIVENESS_SMOKE_OK'; do
            script=${spec%%:*}
            marker=${spec#*:}
            log="$RUNNER_TEMP/${script%.gd}.log"
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script "res://scripts/ci/$script" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then exit 1; fi
          done
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 6 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Assertion failed' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system33-roadside-pole-routing","description":"Roadside power pole routing contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"