name: Prompt streaming transition timing

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  streaming-transition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project assets and classes
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path game --import
      - name: Measure production streaming transition
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path game --script res://scripts/ci/PromptStreamingTransitionTimingSmoke.gd 2>&1 | tee streaming-transition.log
          grep -q "PROMPT_STREAMING_TRANSITION_TIMING_OK" streaming-transition.log
          grep "PROMPT_STREAM_TIMING_RESULT" streaming-transition.log
