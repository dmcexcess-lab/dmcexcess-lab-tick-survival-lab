name: System 33 power and water

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: system33-power-water
  cancel-in-progress: true

jobs:
  verify:
    name: verify/system33-power-water
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 33 source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/33_POWER_WATER_UTILITIES.md
          test -f game/scripts/simulation/utilities/UtilityRuntimeState.gd
          test -f game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          test -f game/scripts/simulation/utilities/UtilityRefrigerationEnvironmentProvider.gd
          test -f game/scripts/app/UtilityGameMain.gd
          test -f game/scripts/ui/UtilityDevControls.gd
          test -f game/scripts/ci/System33PowerWaterSmoke.gd
          grep -q 'power_service_available' game/scripts/simulation/utilities/UtilityRuntimeState.gd
          grep -q 'water_service_available' game/scripts/simulation/utilities/UtilityRuntimeState.gd
          grep -q 'cold_storage_available' game/scripts/simulation/utilities/UtilityRuntimeState.gd
          grep -q 'register_provider' game/scripts/simulation/items/freshness/ItemFreshnessMutationService.gd
          grep -q 'register_provider' game/scripts/simulation/items/freshness/ItemFreshnessQuery.gd
          grep -q 'entity_ids_of_type' game/scripts/simulation/utilities/UtilityPoweredLightingSourceAdapter.gd
          ! grep -R -q '_process' game/scripts/simulation/utilities game/scripts/ui/UtilityDevControls.gd
          ! grep -R -q 'Timer.new' game/scripts/simulation/utilities game/scripts/ui/UtilityDevControls.gd
          ! grep -R -F -q '.entity_ids()' game/scripts/simulation/utilities

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 33 power water smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/System33PowerWaterSmoke.gd 2>&1 | tee "$RUNNER_TEMP/system33.log"
          grep -q 'SYSTEM33_POWER_WATER_SMOKE_OK' "$RUNNER_TEMP/system33.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/system33.log"; then exit 1; fi

      - name: Protected island lighting freshness and performance regressions
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'CompleteIslandWorldPlanningSmoke.gd:COMPLETE_ISLAND_WORLD_PLANNING_SMOKE_OK' \
            'PhysicalLightingSmoke.gd:PHYSICAL_LIGHTING_SMOKE_OK' \
            'ItemFreshnessSmoke.gd:ITEM_FRESHNESS_SMOKE_OK' \
            'PerformanceArchitectureSmoke.gd:PERFORMANCE_ARCHITECTURE_SMOKE_OK' \
            'PlayerInputResponsivenessSmoke.gd:PLAYER_INPUT_RESPONSIVENESS_SMOKE_OK'; do
            script=${spec%%:*}
            marker=${spec#*:}
            log="$RUNNER_TEMP/${script%.gd}.log"
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script "res://scripts/ci/$script" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then exit 1; fi
          done

      - name: Canonical startup regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 6 2>&1 | tee "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Assertion failed|ObjectDB instances leaked at exit|resources still in use at exit' "$RUNNER_TEMP/startup.log"; then exit 1; fi
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"

      - name: Publish System 33 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system33-power-water","description":"System 33 power and water contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
