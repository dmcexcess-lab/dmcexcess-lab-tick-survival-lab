name: Streaming and Materialization Orchestration contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/streaming-materialization.yml'
      - '.github/workflows/interactive-boot-diagnostics.yml'
      - 'game/project.godot'
      - 'game/main.tscn'
      - 'game/scripts/app/**'
      - 'game/scripts/demo/GeneratedIslandCritiqueFixture.gd'
      - 'game/scripts/foundation/world/**'
      - 'game/scripts/foundation/spatial/**'
      - 'game/scripts/generation/**'
      - 'game/scripts/streaming/**'
      - 'game/scripts/simulation/utilities/**'
      - 'game/scripts/ci/ProceduralIslandSeedMatrixSmoke.gd'
      - 'game/scripts/ci/StreamingMaterializationSmoke.gd'
      - 'game/scripts/ci/CountrysideStreamingMaterializationSmoke.gd'
      - 'SYSTEM_DESIGNS/00F_STREAMING_MATERIALIZATION_ORCHESTRATION.md'
  workflow_dispatch:
    inputs:
      full_seed_matrix:
        description: Run the optional twelve-seed stress checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: streaming-materialization-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  streaming-materialization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 00F boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/00F_STREAMING_MATERIALIZATION_ORCHESTRATION.md
          test -f game/scripts/streaming/StreamingRegionGrid.gd
          test -f game/scripts/streaming/MaterializationRecord.gd
          test -f game/scripts/streaming/MaterializationRegistry.gd
          test -f game/scripts/streaming/AreaSiteMaterializationSource.gd
          test -f game/scripts/streaming/CountrysideSourceCatalog.gd
          test -f game/scripts/streaming/CountrysideMaterializationSource.gd
          test -f game/scripts/streaming/WorldMaterializationCoordinator.gd
          test -f game/scripts/streaming/WorldStreamingCoordinator.gd
          test -f game/scripts/ci/StreamingMaterializationSmoke.gd
          test -f game/scripts/ci/CountrysideStreamingMaterializationSmoke.gd
          test -f game/scripts/ci/ProceduralIslandSeedMatrixSmoke.gd
          ! grep -R -q 'scripts/render\|scripts/camera\|scripts/player\|scripts/ui\|scripts/reboot\|foundation/time\|simulation/collision' game/scripts/streaming
          ! grep -R -q 'Texture2D\|Camera2D\|_draw\|_process\|_physics_process' game/scripts/streaming
          grep -q 'source_providers' game/scripts/streaming/WorldMaterializationCoordinator.gd
          grep -q 'source_providers' game/scripts/streaming/WorldStreamingCoordinator.gd
          ! grep -q '_countryside_source\|_watercourse_source' game/scripts/streaming/WorldMaterializationCoordinator.gd game/scripts/streaming/WorldStreamingCoordinator.gd
          grep -q '_area_materializer.materialize_in_transaction' game/scripts/streaming/WorldMaterializationCoordinator.gd
          grep -q 'building_materializer.materialize_in_transaction' game/scripts/generation/areas/AreaMaterializationCoordinator.gd
          grep -q 'set_terrain_rect' game/scripts/generation/areas/AreaMaterializationCoordinator.gd
          grep -q 'TERRAIN_BATCH_SET' game/scripts/foundation/world/WorldChange.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Procedural island planner selected-seed check
        env:
          TICK_LAB_PROCEDURAL_SEED: "20001"
          FULL_SEED_MATRIX: ${{ inputs.full_seed_matrix }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ "$FULL_SEED_MATRIX" = "true" ]; then unset TICK_LAB_PROCEDURAL_SEED; fi
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandSeedMatrixSmoke.gd 2>&1 | tee "$RUNNER_TEMP/procedural-island-seeds.log"
          grep -q 'PROCEDURAL_ISLAND_SEED_MATRIX_SMOKE_OK' "$RUNNER_TEMP/procedural-island-seeds.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|PROCEDURAL_ISLAND_SEED_MATRIX_SMOKE_FAIL' "$RUNNER_TEMP/procedural-island-seeds.log"; then exit 1; fi

      - name: Canonical playable selected-seed boot
        env:
          FULL_SEED_MATRIX: ${{ inputs.full_seed_matrix }}
        shell: bash
        run: |
          set -euxo pipefail
          seeds="20001"
          if [ "$FULL_SEED_MATRIX" = "true" ]; then
            seeds="1 7 29 101 997 20001 28028 104729 524287 999983 123456789 2147483629"
          fi
          for seed in $seeds; do
            log="$RUNNER_TEMP/interactive-seed-$seed.log"
            echo "=== seed=$seed ==="
            TICK_LAB_WORLD_SEED="$seed" ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 10 >"$log" 2>&1
            cat "$log"
            grep -q 'CANONICAL_DEMO_BOOT_OK' "$log"
            if grep -Eqi 'CANONICAL_DEMO_BOOT_FAILED|SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then
              echo "procedural boot failed for seed=$seed"
              exit 1
            fi
          done

      - name: Settlement materialization regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 240 --script res://scripts/ci/StreamingMaterializationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/streaming00f.log"
          grep -q 'STREAMING_MATERIALIZATION_SMOKE_OK' "$RUNNER_TEMP/streaming00f.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|STREAMING_MATERIALIZATION_SMOKE_FAIL' "$RUNNER_TEMP/streaming00f.log"; then exit 1; fi

      - name: Countryside source/materialization contract
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 240 --script res://scripts/ci/CountrysideStreamingMaterializationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/countryside00f.log"
          grep -q 'COUNTRYSIDE_STREAMING_MATERIALIZATION_SMOKE_OK' "$RUNNER_TEMP/countryside00f.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|COUNTRYSIDE_STREAMING_MATERIALIZATION_SMOKE_FAIL' "$RUNNER_TEMP/countryside00f.log"; then exit 1; fi
