name: Actor Locomotion contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actor-locomotion-contract
  cancel-in-progress: true

jobs:
  actor-locomotion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate actor locomotion source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/03_ACTOR_LOCOMOTION_MOVEMENT_CAPABILITY.md
          test -f game/scripts/simulation/movement/MovementPolicyDecision.gd
          test -f game/scripts/simulation/movement/MovementActionResult.gd
          test -f game/scripts/simulation/movement/MovementTraversalPolicy.gd
          test -f game/scripts/simulation/movement/MovementActionService.gd
          test -f game/scripts/simulation/actors/locomotion/ActorStance.gd
          test -f game/scripts/simulation/actors/locomotion/ActorLocomotionRecord.gd
          test -f game/scripts/simulation/actors/locomotion/ActorLocomotionState.gd
          test -f game/scripts/simulation/actors/locomotion/ActorLocomotionMutationService.gd
          test -f game/scripts/simulation/actors/locomotion/ActorMovementCapabilityDecision.gd
          test -f game/scripts/simulation/actors/locomotion/ActorMobilityModifierProvider.gd
          test -f game/scripts/simulation/actors/locomotion/ActorMovementCapabilityService.gd
          test -f game/scripts/simulation/actors/locomotion/ActorMovementTraversalPolicy.gd
          test -f game/scripts/simulation/actors/locomotion/ActorStanceActionResult.gd
          test -f game/scripts/simulation/actors/locomotion/ActorStanceActionService.gd
          test -f game/scripts/ci/ActorLocomotionTestProvider.gd
          test -f game/scripts/ci/ActorLocomotionSmoke.gd
          grep -q 'class_name MovementPolicyDecision' game/scripts/simulation/movement/MovementPolicyDecision.gd
          grep -q 'class_name ActorLocomotionState' game/scripts/simulation/actors/locomotion/ActorLocomotionState.gd
          grep -q 'class_name ActorMovementCapabilityService' game/scripts/simulation/actors/locomotion/ActorMovementCapabilityService.gd
          grep -q 'class_name ActorStanceActionService' game/scripts/simulation/actors/locomotion/ActorStanceActionService.gd
          grep -q 'actor.stance.commit' game/scripts/simulation/actors/locomotion/ActorStanceActionService.gd
          grep -q 'MovementPolicyDecision' game/scripts/simulation/movement/MovementActionService.gd
          ! grep -q 'request_run' game/scripts/simulation/movement/MovementActionService.gd
          ! grep -R -q 'scripts/reboot' game/scripts/simulation/actors/locomotion
          ! grep -R -q 'scripts/render' game/scripts/simulation/actors/locomotion
          ! grep -R -q 'scripts/input' game/scripts/simulation/actors/locomotion
          ! grep -R -q 'scripts/generation' game/scripts/simulation/actors/locomotion
          ! grep -R -q 'scripts/simulation/health' game/scripts/simulation/actors/locomotion
          ! grep -R -q 'scripts/simulation/needs' game/scripts/simulation/actors/locomotion
          ! grep -R -q 'scripts/simulation/inventory' game/scripts/simulation/actors/locomotion

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Movement regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/MovementActionsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/movement-actions-smoke.log"
          grep -q 'MOVEMENT_ACTIONS_SMOKE_OK' "$RUNNER_TEMP/movement-actions-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/movement-actions-smoke.log"; then exit 1; fi

      - name: Actor locomotion contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorLocomotionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/actor-locomotion-smoke.log"
          grep -q 'ACTOR_LOCOMOTION_SMOKE_OK' "$RUNNER_TEMP/actor-locomotion-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/actor-locomotion-smoke.log"; then exit 1; fi
