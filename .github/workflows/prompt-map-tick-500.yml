name: Prompt map tick 500

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/ui/IslandMapView.gd'
      - 'game/scripts/ui/CameraControls.gd'
      - 'game/scripts/ui/PlayerMapBootstrap.gd'
      - 'game/scripts/ci/PromptMapTick500Smoke.gd'
      - '.github/workflows/prompt-map-tick-500.yml'
  workflow_dispatch:

jobs:
  map-tick-500:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project class cache
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --editor --quit
      - name: Verify map at tick 500
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptMapTick500Smoke.gd
