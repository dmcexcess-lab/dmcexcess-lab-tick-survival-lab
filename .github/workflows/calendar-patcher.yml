name: One-shot calendar integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[calendar-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Integrate authoritative calendar
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('game/scripts/MapPreview.gd')
          s = p.read_text()
          if 'const Calendar = preload("res://scripts/WorldCalendar.gd")' not in s:
              s = s.replace(
                  'const Weather = preload("res://scripts/TacticalWeather.gd")\n',
                  'const Weather = preload("res://scripts/TacticalWeather.gd")\nconst Calendar = preload("res://scripts/WorldCalendar.gd")\n'
              )
          s = re.sub(r'^const TICKS_PER_MINUTE := .*$', 'const TICKS_PER_MINUTE := Calendar.TICKS_PER_MINUTE', s, flags=re.M)
          s = re.sub(r'^const DAYS_IN_MONTH := .*$', 'const DAYS_IN_MONTH := Calendar.DAYS_IN_MONTH', s, flags=re.M)
          s = re.sub(
              r'func _current_total_minutes\(\) -> int:\n.*?\n(?=func _format_time)',
              'func _current_total_minutes() -> int:\n    return Calendar.total_minutes(clock_anchor_minutes, clock_anchor_tick, scheduler.world_tick)\n\nfunc _current_minute_of_day() -> int:\n    return Calendar.minute_of_day(clock_anchor_minutes, clock_anchor_tick, scheduler.world_tick)\n\nfunc _current_month_day() -> Vector2i:\n    return Calendar.month_day(clock_anchor_month, clock_anchor_day, clock_anchor_minutes, clock_anchor_tick, scheduler.world_tick)\n\n',
              s,
              flags=re.S
          )
          s = re.sub(
              r'func _sync_scene_time_from_clock\(\) -> void:\n(?:    .*\n)+?(?=\nfunc )',
              'func _sync_scene_time_from_clock() -> void:\n    scene_time = Calendar.phase(_current_minute_of_day())\n',
              s,
              count=1
          )
          s = re.sub(
              r'    draw_string\(font, Vector2\(94, 378\), .*?\n',
              '    draw_string(font, Vector2(94, 378), "Tick %d | %s | Day %dt | Ready %s | Cell %s | Face %s" % [scheduler.world_tick, scene_time.to_upper(), Calendar.TICKS_PER_DAY, str(scheduler.player_ready).to_upper(), str(player.cell), _facing_name(player.facing)], HORIZONTAL_ALIGNMENT_LEFT, -1, 9, Color("a9b9b3"))\n',
              s,
              count=1
          )
          if 'Calendar.total_minutes' not in s or 'Calendar.phase' not in s:
              raise SystemExit('calendar integration did not land')
          p.write_text(s)

          c = Path('README_CONTEXT.md')
          cs = c.read_text()
          cs = re.sub(
              r'The current clock harness uses 600 world ticks per displayed in-game minute.*?once infected timing and body needs are playable\.\n',
              'World time now advances only from authoritative scheduler ticks through `WorldCalendar.gd`. Current tuning is **7,200 ticks per 24-hour day** (5 ticks per displayed minute / 12 displayed seconds per tick). This is a gameplay compression ratio, not a claim that a physical action tick literally equals 12 real seconds. The ratio remains tunable independently of action costs.\n\nDaylight phases are tick-driven: night → dawn (05:30) → day (07:00) → dusk (18:30) → night (20:00). Pausing does not advance calendar time. Weather VFX may continue animating while paused because they remain presentation-only.\n',
              cs,
              flags=re.S
          )
          c.write_text(cs)

          ch = Path('CHANGELOG.md')
          text = ch.read_text()
          entry = '''## Tick-Driven Calendar / Day-Night Cycle — 2026-08-14\n\n- Added `WorldCalendar.gd` as the durable tick-to-calendar owner.\n- Set initial play-test compression to 7,200 authoritative ticks per 24-hour day (5 ticks per game minute).\n- Movement, turning, doors, combat proofs, and every future timed action now naturally advance visible clock/date through the same scheduler tick count.\n- Added tick-driven night, dawn, day, and dusk phases; pausing does not advance the sun/calendar.\n- Added dawn/dusk ambient lighting and reduced window daylight during transition phases.\n- Added deterministic calendar smoke coverage for rate, phase boundaries, and date rollover.\n\n'''
          if '## Tick-Driven Calendar / Day-Night Cycle' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry)
          ch.write_text(text)
      - name: Commit calendar integration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/MapPreview.gd README_CONTEXT.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Integrate tick-driven calendar [calendar-patched]"
          git push origin HEAD:main
