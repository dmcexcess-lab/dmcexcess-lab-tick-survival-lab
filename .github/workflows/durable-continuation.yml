name: Durable continuation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Run persistence protected regressions
        shell: bash
        run: |
          set -euxo pipefail
          for smoke in \
            TickKernelSmoke.gd \
            WorldStateSmoke.gd \
            StreamingMaterializationSmoke.gd \
            InventoryContainmentSmoke.gd \
            System34SurvivorConditionSmoke.gd \
            System33PowerPhysicalNetworkSmoke.gd \
            VehicleSmoke.gd \
            WorldInteractionSmoke.gd \
            WeatherSmoke.gd \
            CanonicalDemoSmoke.gd
          do
            timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s "res://scripts/ci/$smoke"
          done
      - name: Verify durable save close reopen Continue
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/DurableContinuationSmoke.gd
