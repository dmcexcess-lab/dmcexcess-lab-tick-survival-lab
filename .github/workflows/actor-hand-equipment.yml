name: Actor Hand Equipment contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actor-hand-equipment-contract
  cancel-in-progress: true

jobs:
  actor-hand-equipment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate actor hand equipment source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/09_ACTOR_HAND_EQUIPMENT_STATE.md
          test -f game/scripts/simulation/actors/equipment/ActorHandSlot.gd
          test -f game/scripts/simulation/actors/equipment/ActorHandEquipmentRecord.gd
          test -f game/scripts/simulation/actors/equipment/ActorHandEquipmentState.gd
          test -f game/scripts/simulation/actors/equipment/ActorHandEquipmentMutationService.gd
          test -f game/scripts/ci/ActorHandEquipmentSmoke.gd
          grep -q 'class_name ActorHandEquipmentState' game/scripts/simulation/actors/equipment/ActorHandEquipmentState.gd
          grep -q 'class_name ActorHandEquipmentMutationService' game/scripts/simulation/actors/equipment/ActorHandEquipmentMutationService.gd
          grep -q 'PRIMARY_RIGHT' game/scripts/simulation/actors/equipment/ActorHandSlot.gd
          grep -q 'SECONDARY_LEFT' game/scripts/simulation/actors/equipment/ActorHandSlot.gd
          ! grep -R -q 'scripts/render' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/art' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/foundation/time' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/simulation/collision' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/simulation/movement' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/input' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/ui' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/reboot' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/ai' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/health' game/scripts/simulation/actors/equipment
          ! grep -R -q 'scripts/inventory' game/scripts/simulation/actors/equipment

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Persistent WHAT regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/WorldStateSmoke.gd 2>&1 | tee "$RUNNER_TEMP/world-state-smoke.log"
          grep -q 'WORLD_STATE_SMOKE_OK' "$RUNNER_TEMP/world-state-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/world-state-smoke.log"; then exit 1; fi

      - name: Actor hand equipment contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHandEquipmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/actor-hand-equipment-smoke.log"
          grep -q 'ACTOR_HAND_EQUIPMENT_SMOKE_OK' "$RUNNER_TEMP/actor-hand-equipment-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/actor-hand-equipment-smoke.log"; then exit 1; fi
