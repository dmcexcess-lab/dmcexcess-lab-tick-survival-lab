name: Large Area Critique Runtime contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: large-area-critique-runtime-contract
  cancel-in-progress: true

jobs:
  large-area-critique:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 20/22 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/22_LARGE_AREA_CRITIQUE_RUNTIME.md
          test -f game/scripts/generation/areas/AreaMaterializationCoordinator.gd
          test -f game/scripts/demo/RuralCrossroadsCritiqueFixture.gd
          test -f game/scripts/view/LargeAreaRenderWindowController.gd
          test -f game/scripts/ci/LargeAreaCritiqueRuntimeSmoke.gd
          ! grep -q 'Texture2D\|atlas_index\|scripts/render\|scripts/ui\|scripts/player\|Camera2D' game/scripts/generation/areas/AreaMaterializationCoordinator.gd
          ! grep -q 'LocalAreaGenerator\|BuildingGenerator\|WorldMutation' game/scripts/view/LargeAreaRenderWindowController.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Preserve System 20 pure planner
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/LocalAreaGenerationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/area20.log"
          grep -q 'LOCAL_AREA_GENERATION_SMOKE_OK' "$RUNNER_TEMP/area20.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/area20.log"; then exit 1; fi

      - name: Preserve System 21 camera
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/CameraViewControlSmoke.gd 2>&1 | tee "$RUNNER_TEMP/camera21.log"
          grep -q 'CAMERA_VIEW_CONTROL_SMOKE_OK' "$RUNNER_TEMP/camera21.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/camera21.log"; then exit 1; fi

      - name: Large-area critique integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 45 --script res://scripts/ci/LargeAreaCritiqueRuntimeSmoke.gd 2>&1 | tee "$RUNNER_TEMP/area22.log"
          grep -q 'LARGE_AREA_CRITIQUE_RUNTIME_SMOKE_OK' "$RUNNER_TEMP/area22.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/area22.log"; then exit 1; fi

      - name: Canonical generated-area startup
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 8 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
