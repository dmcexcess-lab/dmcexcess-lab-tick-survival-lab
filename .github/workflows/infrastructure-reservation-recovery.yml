name: Turn-based production boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: turn-based-production-boot-known
  cancel-in-progress: true

jobs:
  production-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify canonical turn-based production boot
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/TurnBasedProductionBootMatrixSmoke.gd
      - name: Guard turn game from legacy simulation execution
        run: |
          grep -q '^extends GameMain$' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'EnvironmentalPressureGameMain' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'UtilityGameMain' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'scripts/demo' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'MovementActionService' game/scripts/player/SimpleTurnController.gd
      - name: Preserve procedural generation regression
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/ProceduralIslandSeedMatrixSmoke.gd
