name: Slice 3 simple combat

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice3-simple-combat
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify production simple-turn combat route
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/Slice3SimpleCombatSmoke.gd
      - name: Guard migrated combat from legacy execution
        shell: bash
        run: |
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'CombatActionService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'MovementActionService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'SpatialQueryService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'WorldMutationService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'TimedAction' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'ScheduledEvent' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'TickKernel' game/scripts/simulation/combat/ActorDeathTransitionService.gd
          ! grep -q 'WorldMutationService' game/scripts/simulation/combat/ActorDeathTransitionService.gd
