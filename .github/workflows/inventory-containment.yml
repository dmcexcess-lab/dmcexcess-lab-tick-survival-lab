name: Inventory Containment contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inventory-containment-contract
  cancel-in-progress: true

jobs:
  inventory-containment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inventory containment source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/11_INVENTORY_CONTAINMENT.md
          test -f game/scripts/simulation/inventory/InventoryContainerRecord.gd
          test -f game/scripts/simulation/inventory/InventoryContainmentState.gd
          test -f game/scripts/simulation/inventory/InventoryContainmentMutationService.gd
          test -f game/scripts/ci/InventoryContainmentSmoke.gd
          grep -q 'class_name InventoryContainmentState' game/scripts/simulation/inventory/InventoryContainmentState.gd
          grep -q 'class_name InventoryContainmentMutationService' game/scripts/simulation/inventory/InventoryContainmentMutationService.gd
          grep -q 'container_of' game/scripts/simulation/inventory/InventoryContainmentState.gd
          grep -q 'direct_contents' game/scripts/simulation/inventory/InventoryContainmentState.gd
          ! grep -R -q 'simulation/actors/equipment' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/render' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/art' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/foundation/time' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/simulation/collision' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/simulation/movement' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/simulation/actors/locomotion' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/input' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/ui' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/reboot' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/generation' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/ai' game/scripts/simulation/inventory
          ! grep -R -q 'scripts/health' game/scripts/simulation/inventory

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Persistent WHAT regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/WorldStateSmoke.gd 2>&1 | tee "$RUNNER_TEMP/world-state-smoke.log"
          grep -q 'WORLD_STATE_SMOKE_OK' "$RUNNER_TEMP/world-state-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/world-state-smoke.log"; then exit 1; fi

      - name: Actor hand equipment regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHandEquipmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/actor-hand-equipment-smoke.log"
          grep -q 'ACTOR_HAND_EQUIPMENT_SMOKE_OK' "$RUNNER_TEMP/actor-hand-equipment-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/actor-hand-equipment-smoke.log"; then exit 1; fi

      - name: Inventory containment contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/InventoryContainmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/inventory-containment-smoke.log"
          grep -q 'INVENTORY_CONTAINMENT_SMOKE_OK' "$RUNNER_TEMP/inventory-containment-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/inventory-containment-smoke.log"; then exit 1; fi
