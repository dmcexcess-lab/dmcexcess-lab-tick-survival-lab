name: World Time Ambient Daylight contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: world-time-ambient-daylight-contract
  cancel-in-progress: true

jobs:
  world-time-ambient:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 25 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/25_WORLD_TIME_AMBIENT_DAYLIGHT.md
          test -f game/scripts/simulation/world_time/WorldTimeProfile.gd
          test -f game/scripts/simulation/world_time/WorldTimeService.gd
          test -f game/scripts/simulation/world_time/DaylightProfile.gd
          test -f game/scripts/simulation/world_time/OutdoorAmbientLightService.gd
          test -f game/scripts/ci/WorldTimeAmbientSmoke.gd
          grep -q 'DEFAULT_TICKS_PER_SECOND: int = 5' game/scripts/simulation/world_time/WorldTimeProfile.gd
          grep -q 'DEFAULT_START_SECOND_OF_DAY: int = 8' game/scripts/simulation/world_time/WorldTimeProfile.gd
          grep -q 'class_name WorldTimeService' game/scripts/simulation/world_time/WorldTimeService.gd
          grep -q 'class_name OutdoorAmbientLightService' game/scripts/simulation/world_time/OutdoorAmbientLightService.gd
          grep -q 'set_perception_ambient_light_level' game/scripts/app/CanonicalDemoMain.gd
          grep -q 'OutdoorAmbientLightServiceClass' game/scripts/app/CanonicalDemoMain.gd
          ! test -f game/scripts/demo/DemoAmbientLightCycle.gd
          ! grep -R -q 'func _process\|func _physics_process' game/scripts/simulation/world_time
          ! grep -R -q 'Time\.get_\|Time\.get_time\|Time\.get_datetime' game/scripts/simulation/world_time
          ! grep -R -q 'scripts/generation\|scripts/simulation/loot\|scripts/simulation/health\|scripts/simulation/combat' game/scripts/simulation/world_time

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 25 world time ambient smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/WorldTimeAmbientSmoke.gd 2>&1 | tee "$RUNNER_TEMP/world-time25.log"
          grep -q 'WORLD_TIME_AMBIENT_SMOKE_OK' "$RUNNER_TEMP/world-time25.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/world-time25.log"; then exit 1; fi

      - name: WHEN regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/TickKernelSmoke.gd 2>&1 | tee "$RUNNER_TEMP/when00c.log"
          grep -q 'TICK_KERNEL_SMOKE_OK' "$RUNNER_TEMP/when00c.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/when00c.log"; then exit 1; fi

      - name: System 23 ambient perception regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/PerceptionAmbientMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23-ambient.log"
          grep -q 'PERCEPTION_AMBIENT_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23-ambient.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerceptionFogMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOG_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23-ambient.log" "$RUNNER_TEMP/perception23.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 25 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system25-world-time-light","description":"System 25 world time ambient contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"