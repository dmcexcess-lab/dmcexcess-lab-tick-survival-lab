name: Performance staging verification

on:
  push:
    branches:
      - perf-architecture-gate

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Performance architecture smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerformanceArchitectureSmoke.gd 2>&1 | tee "$RUNNER_TEMP/perf.log"
          grep -q 'PERFORMANCE_ARCHITECTURE_SMOKE_OK' "$RUNNER_TEMP/perf.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perf.log"; then exit 1; fi

      - name: Protected hot-path regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerformanceRazorSmoke.gd | tee "$RUNNER_TEMP/razor.log"
          grep -q 'PERFORMANCE_RAZOR_SMOKE_OK' "$RUNNER_TEMP/razor.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PhysicalLightingSmoke.gd | tee "$RUNNER_TEMP/light.log"
          grep -q 'PHYSICAL_LIGHTING_SMOKE_OK' "$RUNNER_TEMP/light.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/WorldInteractionStreamingBurstSmoke.gd | tee "$RUNNER_TEMP/interact.log"
          grep -q 'WORLD_INTERACTION_STREAMING_BURST_SMOKE_OK' "$RUNNER_TEMP/interact.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/StreamingMaterializationSmoke.gd | tee "$RUNNER_TEMP/stream.log"
          grep -q 'STREAMING_MATERIALIZATION_SMOKE_OK' "$RUNNER_TEMP/stream.log"
