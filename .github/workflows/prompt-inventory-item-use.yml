name: Prompt Inventory Item Use

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-item-use:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Verify ordinary Inventory exact-item EAT and DRINK
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptInventoryItemUseSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prompt-inventory-item-use.log"
          grep -q 'PROMPT_INVENTORY_ITEM_USE_SMOKE_OK' "$RUNNER_TEMP/prompt-inventory-item-use.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prompt-inventory-item-use.log"; then exit 1; fi
