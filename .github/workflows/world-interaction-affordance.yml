name: World Interaction Affordance Reach contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: world-interaction-affordance-reach-contract
  cancel-in-progress: true

jobs:
  interaction-affordance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 29 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/29_WORLD_INTERACTION_AFFORDANCE_REACH.md
          test -f game/scripts/simulation/interaction/WorldInteractionReachQuery.gd
          test -f game/scripts/simulation/interaction/InteractionOffer.gd
          test -f game/scripts/simulation/interaction/InteractionOfferProvider.gd
          test -f game/scripts/simulation/interaction/InteractionAffordanceQuery.gd
          test -f game/scripts/simulation/loot/LootSearchInteractionOfferProvider.gd
          test -f game/scripts/render/InteractionHighlightRenderer.gd
          test -f game/scripts/ci/WorldInteractionAffordanceSmoke.gd
          test ! -f game/scripts/simulation/loot/LootInteractionReach.gd
          grep -q 'Status: \*\*APPROVED\|Status: \*\*IMPLEMENTED' SYSTEM_DESIGNS/29_WORLD_INTERACTION_AFFORDANCE_REACH.md
          grep -q 'CONTACT_FORWARD' game/scripts/simulation/interaction/WorldInteractionReachQuery.gd
          grep -q 'entities_at' game/scripts/simulation/interaction/WorldInteractionReachQuery.gd
          grep -q 'knowledge_state' game/scripts/simulation/interaction/InteractionAffordanceQuery.gd
          grep -q 'scavenge.search_container' game/scripts/simulation/loot/LootSearchInteractionOfferProvider.gd
          grep -q 'InteractionHighlightRenderer' game/scripts/render/TacticalRendererStack.gd
          ! grep -R -F -q 'entity_ids()' game/scripts/simulation/interaction game/scripts/simulation/loot/LootSearchInteractionOfferProvider.gd
          ! grep -R -E -q 'func _process|func _physics_process' game/scripts/simulation/interaction game/scripts/render/InteractionHighlightRenderer.gd
          ! grep -R -q 'WorldMutationService\|DoorStateMutationService' game/scripts/simulation/interaction game/scripts/render/InteractionHighlightRenderer.gd
          ! grep -R -q 'scripts/simulation/lighting' game/scripts/simulation/interaction
          ! grep -R -q 'scripts/render' game/scripts/simulation/interaction

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 29 focused contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/WorldInteractionAffordanceSmoke.gd 2>&1 | tee "$RUNNER_TEMP/interaction29.log"
          grep -q 'WORLD_INTERACTION_AFFORDANCE_SMOKE_OK' "$RUNNER_TEMP/interaction29.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/interaction29.log"; then exit 1; fi

      - name: System 24 reach and loot regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/WorldLootSmoke.gd 2>&1 | tee "$RUNNER_TEMP/loot24.log"
          grep -q 'WORLD_LOOT_SMOKE_OK' "$RUNNER_TEMP/loot24.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/loot24.log"; then exit 1; fi

      - name: System 23 perception regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerceptionFogMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOG_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23.log"; then exit 1; fi

      - name: Canonical player-shell regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/CanonicalPlayerShellSmoke.gd 2>&1 | tee "$RUNNER_TEMP/shell16.log"
          grep -q 'CANONICAL_PLAYER_SHELL_SMOKE_OK' "$RUNNER_TEMP/shell16.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/shell16.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 29 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system29-interaction-affordance","description":"System 29 interaction affordance contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
