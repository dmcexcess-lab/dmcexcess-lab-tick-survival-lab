name: Tactical Camera and View Control contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: camera-view-control-contract
  cancel-in-progress: true

jobs:
  camera-view-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 21 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/21_TACTICAL_CAMERA_VIEW_CONTROL.md
          test -f game/scripts/camera/TacticalCameraState.gd
          test -f game/scripts/camera/ZoomController.gd
          test -f game/scripts/camera/TacticalCameraController.gd
          test -f game/scripts/input/CameraInputAdapter.gd
          test -f game/scripts/ui/CameraControls.gd
          test -f game/scripts/ci/CameraViewControlSmoke.gd
          ! grep -R -q 'WorldMutationService\|scripts/generation\|scripts/simulation/movement\|scripts/simulation/doors\|scripts/art\|scripts/render' game/scripts/camera

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 21 camera contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/CameraViewControlSmoke.gd 2>&1 | tee "$RUNNER_TEMP/camera21.log"
          grep -q 'CAMERA_VIEW_CONTROL_SMOKE_OK' "$RUNNER_TEMP/camera21.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/camera21.log"; then exit 1; fi

      - name: Door pointer regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/DoorInteractionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/door18.log"
          grep -q 'DOOR_INTERACTION_SMOKE_OK' "$RUNNER_TEMP/door18.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/door18.log"; then exit 1; fi

      - name: System 20 planner regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/LocalAreaGenerationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/area20.log"
          grep -q 'LOCAL_AREA_GENERATION_SMOKE_OK' "$RUNNER_TEMP/area20.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/area20.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
