name: Prompt loading UI single press

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/ui/CameraControls.gd'
      - 'game/scripts/ui/StartupMenu.gd'
      - 'game/scripts/ci/PromptLoadingUiSinglePressSmoke.gd'
      - '.github/workflows/prompt-loading-ui-single-press.yml'
  workflow_dispatch:

jobs:
  loading-ui-single-press:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project class cache
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --editor --quit
      - name: Verify loading dots and MAP single press
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptLoadingUiSinglePressSmoke.gd
