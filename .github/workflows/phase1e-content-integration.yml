name: Phase 1E content integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: phase1e-content-integration
  cancel-in-progress: true

jobs:
  verify:
    name: verify/phase1e-content-integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Phase 1E source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/PHASE_1E_CONTENT_EXPANSION_INTEGRATION.md
          test -f game/scripts/generation/buildings/content/Phase1EOneStoryContentDresser.gd
          test -f game/scripts/ci/Phase1EContentIntegrationSmoke.gd
          grep -q 'MAX_ACCENTS_PER_BUILDING: int = 2' game/scripts/generation/buildings/content/Phase1EOneStoryContentDresser.gd
          grep -q 'prop.deciduous_large' game/scripts/art/PropVisualGeometryCatalog.gd
          grep -q 'prop.traffic_light' game/scripts/art/PropVisualGeometryCatalog.gd
          grep -q 'CATALOG_VERSION: int = 5' game/scripts/simulation/loot/LootItemCatalog.gd
          grep -q 'CATALOG_VERSION: int = 2' game/scripts/simulation/items/freshness/ItemFreshnessProfileCatalog.gd
          ! grep -R -q '_process' game/scripts/generation/buildings/content game/scripts/simulation/loot/LootItemCatalog.gd game/scripts/simulation/items/freshness/ItemFreshnessProfileCatalog.gd
          ! grep -R -q 'Timer.new' game/scripts/generation/buildings/content game/scripts/simulation/loot/LootItemCatalog.gd game/scripts/simulation/items/freshness/ItemFreshnessProfileCatalog.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Phase 1E integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/Phase1EContentIntegrationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/phase1e.log"
          grep -q 'PHASE1E_CONTENT_INTEGRATION_SMOKE_OK' "$RUNNER_TEMP/phase1e.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/phase1e.log"; then exit 1; fi

      - name: Protected content regressions
        shell: bash
        run: |
          set -euxo pipefail
          for spec in \
            'LocalBuildingGenerationSmoke.gd:LOCAL_BUILDING_GENERATION_SMOKE_OK' \
            'BuildingGrammarSmoke.gd:BUILDING_GRAMMAR_SMOKE_OK' \
            'BaselineAreaProfilesSmoke.gd:BASELINE_AREA_PROFILES_SMOKE_OK' \
            'WorldLootSmoke.gd:WORLD_LOOT_SMOKE_OK' \
            'ItemFreshnessSmoke.gd:ITEM_FRESHNESS_SMOKE_OK' \
            'SemanticUiIconsSmoke.gd:SEMANTIC_UI_ICONS_SMOKE_OK' \
            'PropVisualGeometrySmoke.gd:PROP_VISUAL_GEOMETRY_SMOKE_OK'; do
            script=${spec%%:*}
            marker=${spec#*:}
            log="$RUNNER_TEMP/${script%.gd}.log"
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script "res://scripts/ci/$script" 2>&1 | tee "$log"
            grep -q "$marker" "$log"
            if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$log"; then exit 1; fi
          done

      - name: Canonical startup regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 6 2>&1 | tee "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access|Assertion failed|ObjectDB instances leaked at exit|resources still in use at exit' "$RUNNER_TEMP/startup.log"; then exit 1; fi
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"

      - name: Publish Phase 1E exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/phase1e-content-integration","description":"Phase 1E content integration contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
