name: Fix typed parking rows

"on":
  push:
    paths:
      - '.github/workflows/parking-rows-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply parking row fix
        shell: bash
        run: python3 .parking_rows_fix.py
      - name: Commit fix and remove temporary writer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .parking_rows_fix.py .github/workflows/parking-rows-fix.yml
          git add game/scripts/ProceduralRegionGenerator.gd
          git commit -m 'Fix typed parking row generation'
          git push origin HEAD:main
