name: Structure Layer Renderer contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: structure-layer-renderer-contract
  cancel-in-progress: true

jobs:
  structure-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate structure renderer source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/06_STRUCTURE_LAYER_RENDERER.md
          test -f game/scripts/render/StructureDrawCommand.gd
          test -f game/scripts/render/StructureLayerRenderer.gd
          test -f game/scripts/ci/StructureLayerRendererSmoke.gd
          grep -q 'class_name StructureDrawCommand' game/scripts/render/StructureDrawCommand.gd
          grep -q 'class_name StructureLayerRenderer' game/scripts/render/StructureLayerRenderer.gd
          grep -q 'plan_visible_commands' game/scripts/render/StructureLayerRenderer.gd
          grep -q 'DoorStateStore' game/scripts/render/StructureLayerRenderer.gd
          grep -q 'draw_texture_rect_region' game/scripts/render/StructureLayerRenderer.gd
          ! grep -R -q 'scripts/simulation/collision' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/foundation/time' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/simulation/movement' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/simulation/actors' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/generation' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/reboot' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/camera' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/input' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/ui' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/perception' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/weather' game/scripts/render/Structure*.gd
          ! grep -R -q 'scripts/sound' game/scripts/render/Structure*.gd
          ! grep -R -q 'GroundLayerRenderer' game/scripts/render/Structure*.gd
          ! grep -R -q '_process' game/scripts/render/StructureLayerRenderer.gd
          ! grep -E -q 'tactical_atlas|clutter_atlas|world_art_atlas|building_props_atlas|final_environment' game/scripts/render/Structure*.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Recovered art catalog regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ArtCatalogSmoke.gd 2>&1 | tee "$RUNNER_TEMP/art-catalog-smoke.log"
          grep -q 'ART_CATALOG_SMOKE_OK' "$RUNNER_TEMP/art-catalog-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/art-catalog-smoke.log"; then exit 1; fi

      - name: Ground renderer regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/GroundLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/ground-smoke.log"
          grep -q 'GROUND_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/ground-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/ground-smoke.log"; then exit 1; fi

      - name: Door state regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/DoorStateSmoke.gd 2>&1 | tee "$RUNNER_TEMP/door-state-smoke.log"
          grep -q 'DOOR_STATE_SMOKE_OK' "$RUNNER_TEMP/door-state-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/door-state-smoke.log"; then exit 1; fi

      - name: Structure layer renderer contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/StructureLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/structure-renderer-smoke.log"
          grep -q 'STRUCTURE_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/structure-renderer-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/structure-renderer-smoke.log"; then exit 1; fi
