name: Slice 5 survival and menu repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice5-survival-menu-repair
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify production menu repair and survival route
        run: timeout 240s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/Slice5SurvivalMenuSmoke.gd
      - name: Guard canonical survival from legacy execution
        shell: bash
        run: |
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'TimedAction' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'ScheduledEvent' game/scripts/player/SimpleTurnController.gd
          grep -q 'advance_elapsed_ticks' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q '_kernel.world_tick.*advance_elapsed_ticks' game/scripts/app/TurnBasedGameMain.gd
          grep -q 'save_menu_requested.connect' game/scripts/app/TurnBasedGameMain.gd
          grep -q 'change_scene_to_file(STARTUP_SCENE_PATH)' game/scripts/app/EnvironmentalPressureGameMain.gd
          ! grep -q '\[node name="SessionControls"' game/gameplay.tscn
