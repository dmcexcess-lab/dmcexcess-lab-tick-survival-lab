name: Prompt stats and moodlets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats-moodlets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project assets and classes
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path game --import
      - name: Verify production stats and moodlets
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path game --script res://scripts/ci/PromptStatsMoodletsSmoke.gd 2>&1 | tee stats-moodlets.log
          grep -q "PROMPT_STATS_MOODLETS_OK" stats-moodlets.log
          grep "PROMPT_STATS_MOODLETS_STATE" stats-moodlets.log
