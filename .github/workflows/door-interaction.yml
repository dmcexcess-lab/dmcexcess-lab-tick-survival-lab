name: Door Interaction and Automatic Passage contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: door-interaction-contract
  cancel-in-progress: true

jobs:
  door-interaction:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 18 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/18_DOOR_INTERACTION_PASSAGE.md
          test -f game/scripts/simulation/movement/MovementPassageResolver.gd
          test -f game/scripts/simulation/movement/PassageAwareMovementActionService.gd
          test -f game/scripts/simulation/doors/DoorPhysicalTransitionService.gd
          test -f game/scripts/simulation/doors/DoorMovementPassageResolver.gd
          test -f game/scripts/simulation/doors/DoorInteractionActionService.gd
          test -f game/scripts/input/DoorPointerInputAdapter.gd
          test -f game/scripts/ci/DoorInteractionSmoke.gd
          grep -q 'not_facing_door' game/scripts/simulation/doors/DoorInteractionActionService.gd
          grep -q 'NOISE_LOUD' game/scripts/simulation/doors/DoorPhysicalTransitionService.gd
          ! grep -q 'simulation/doors' game/scripts/simulation/movement/PassageAwareMovementActionService.gd
          ! grep -q 'render/' game/scripts/simulation/doors/DoorInteractionActionService.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Protected movement and door state regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/DoorStateSmoke.gd | tee "$RUNNER_TEMP/doorstate.log"
          grep -q 'DOOR_STATE_SMOKE_OK' "$RUNNER_TEMP/doorstate.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/MovementActionsSmoke.gd | tee "$RUNNER_TEMP/movement.log"
          grep -q 'MOVEMENT_ACTIONS_SMOKE_OK' "$RUNNER_TEMP/movement.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/RunDamageWalkingSmoke.gd | tee "$RUNNER_TEMP/run.log"
          grep -q 'RUN_DAMAGE_WALKING_SMOKE_OK' "$RUNNER_TEMP/run.log"

      - name: System 18 integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/DoorInteractionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/door18.log"
          grep -q 'DOOR_INTERACTION_SMOKE_OK' "$RUNNER_TEMP/door18.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/door18.log"; then exit 1; fi

      - name: Canonical demo regressions and startup
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalDemoSmoke.gd | tee "$RUNNER_TEMP/demo.log"
          grep -q 'CANONICAL_DEMO_SMOKE_OK' "$RUNNER_TEMP/demo.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
