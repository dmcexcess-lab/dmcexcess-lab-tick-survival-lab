name: Slice 4 scavenging inventory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice4-scavenging-inventory
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify production scavenging inventory route and protected combat regression
        run: timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/Slice4ScavengingInventorySmoke.gd
      - name: Guard migrated inventory from legacy execution
        shell: bash
        run: |
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'ItemTransferActionService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'LootSearchActionService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'TimedAction' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'ScheduledEvent' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'run_until_stop' game/scripts/player/SimpleTurnController.gd
          grep -q 'configure_simple_inventory_turns' game/scripts/ui/CanonicalPlayerShell.gd
          grep -q '_simple_turns.search_loot_container' game/scripts/app/TurnBasedGameMain.gd
