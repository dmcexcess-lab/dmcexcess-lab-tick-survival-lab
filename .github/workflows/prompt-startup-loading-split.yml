name: Prompt startup loading split

on:
  push:
    branches: [main]
    paths:
      - 'game/main.tscn'
      - 'game/gameplay.tscn'
      - 'game/scripts/ui/StartupMenu.gd'
      - 'game/scripts/ci/PromptStartupLoadingSplitSmoke.gd'
      - '.github/workflows/prompt-startup-loading-split.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-loading-split:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --editor --quit

      - name: Verify startup loading split
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptStartupLoadingSplitSmoke.gd
