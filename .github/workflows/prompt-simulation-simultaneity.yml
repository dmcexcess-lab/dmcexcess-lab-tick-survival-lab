name: Prompt Simulation Simultaneity

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/foundation/time/ScheduledEvent.gd'
      - 'game/scripts/foundation/world/WorldMutationService.gd'
      - 'game/scripts/simulation/movement/MovementActionService.gd'
      - 'game/scripts/ci/PromptSimulationSimultaneitySmoke.gd'
      - '.github/workflows/prompt-simulation-simultaneity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-simultaneity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Prepare Godot project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit

      - name: Verify same-timestamp deterministic movement batching
        shell: bash
        run: |
          set -euxo pipefail
          timeout --kill-after=10s 120s stdbuf -oL -eL ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptSimulationSimultaneitySmoke.gd 2>&1 | tee "$RUNNER_TEMP/prompt-simulation-simultaneity.log"
          grep -q 'PROMPT_SIMULATION_SIMULTANEITY_SMOKE: PASS' "$RUNNER_TEMP/prompt-simulation-simultaneity.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prompt-simulation-simultaneity.log"; then exit 1; fi
