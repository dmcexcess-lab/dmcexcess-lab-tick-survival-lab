name: One-shot terminology cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/terminology-cleanup-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Prepare final terminology cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neutralize legacy comparison shorthand
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          title_a = bytes.fromhex('5a6f6d626f6964').decode()
          title_b = bytes.fromhex('556c74696d61').decode()

          replacements = [
              (f'{title_b}-style turn-based mini {title_a}', 'turn-based persistent zombie survival'),
              (f'{title_b}-style mini-{title_a}', 'persistent reduced-complexity survival'),
              (f'{title_b}-style mini {title_a}', 'persistent reduced-complexity survival'),
              (f'turn-based mini {title_a}', 'turn-based persistent zombie survival'),
              (f'mini-{title_a}', 'reduced-complexity survival'),
              (f'mini {title_a}', 'reduced-complexity survival'),
              (f'Project {title_a}', 'large-world survival'),
              (f'{title_a}-style', 'large-world'),
              (f'{title_a}-like', 'project-native'),
              (f'{title_b} Online', 'persistent-world'),
              (f'{title_b}-style', 'persistent-world'),
              (title_a, 'survival-game'),
              (title_b, 'persistent-world'),
          ]

          changed = []
          allowed_suffixes = {'.md', '.yml', '.yaml', '.gd', '.tscn', '.godot', '.cfg'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed_suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          remaining = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if title_a in text or title_b in text:
                  remaining.append(str(path))

          print('Changed files:')
          for path in changed:
              print(path)
          if remaining:
              raise SystemExit('Forbidden comparison shorthand remains in: ' + ', '.join(remaining))
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No cleanup changes required.'
            exit 0
          fi
          git config user.name 'dmcexcess-lab'
          git config user.email 'dmcexcess@gmail.com'
          git add -A
          git commit -m 'Finish canonical terminology cleanup'
          git push origin HEAD:main
