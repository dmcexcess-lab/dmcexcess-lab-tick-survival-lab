name: Slice 7 craft heal repair deconstruct
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slice7-craft-heal-repair
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify production Slice 7 route
        run: timeout 240s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/Slice7CraftHealRepairSmoke.gd
      - name: Guard migrated route from legacy execution
        shell: bash
        run: |
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'TimedAction' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'ScheduledEvent' game/scripts/player/SimpleTurnController.gd
          grep -q 'run_simple_craft' game/scripts/app/Slice7GameMain.gd
          grep -q 'run_simple_first_aid' game/scripts/app/Slice7GameMain.gd
          grep -q 'run_simple_repair' game/scripts/app/Slice7GameMain.gd
          grep -q 'run_simple_deconstruct' game/scripts/app/Slice7GameMain.gd
          ! grep -q 'run_until_stop' game/scripts/app/Slice7GameMain.gd
          ! grep -q 'begin_action' game/scripts/app/Slice7GameMain.gd
          ! grep -q 'TimedAction' game/scripts/app/Slice7GameMain.gd
          ! grep -q 'ScheduledEvent' game/scripts/app/Slice7GameMain.gd
          ! grep -q '\[node name="SessionControls"' game/gameplay.tscn
