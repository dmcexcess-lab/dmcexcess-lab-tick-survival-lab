name: Prompt repeated session lifecycle

on:
  push:
    branches: [main, fix/repeated-session-lifecycle]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-session:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Import project assets and classes
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path game --import
      - name: Verify two production sessions
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path game --script res://scripts/ci/PromptRepeatedSessionLifecycleSmoke.gd 2>&1 | tee repeated-session.log
          grep -q "PROMPT_REPEATED_SESSION_LIFECYCLE_OK" repeated-session.log
          if grep -q "Object was freed or unreferenced while a signal is being emitted" repeated-session.log; then
            exit 1
          fi
