name: Weather Atmosphere contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: weather-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 28 Slices A+B+C plus P3/P3B presentation boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/28_WEATHER_ATMOSPHERE.md
          test -f game/scripts/simulation/weather/WeatherProfile.gd
          test -f game/scripts/simulation/weather/WeatherState.gd
          test -f game/scripts/simulation/weather/WeatherService.gd
          test -f game/scripts/simulation/weather/LightningEvent.gd
          test -f game/scripts/simulation/weather/SkyExposureQuery.gd
          test -f game/scripts/simulation/weather/WeatherAtmosphericOpticsAdapter.gd
          test -f game/scripts/simulation/weather/WeatherAcousticEnvironmentModifier.gd
          test -f game/scripts/render/WeatherPresentationRenderer.gd
          test -f game/scripts/render/WeatherAtmosphereSurface.gd
          test -f game/shaders/weather_atmosphere.gdshader
          test -f game/scripts/ui/WeatherDevControls.gd
          test -f game/scripts/ci/WeatherSmoke.gd
          test -f game/scripts/ci/WeatherEnvironmentIntegrationSmoke.gd
          test -f game/scripts/ci/WeatherLightningSmoke.gd
          grep -q 'class_name WeatherService' game/scripts/simulation/weather/WeatherService.gd
          grep -q 'class_name LightningEvent' game/scripts/simulation/weather/LightningEvent.gd
          grep -q 'class_name WeatherAtmosphericOpticsAdapter' game/scripts/simulation/weather/WeatherAtmosphericOpticsAdapter.gd
          grep -q 'class_name WeatherAcousticEnvironmentModifier' game/scripts/simulation/weather/WeatherAcousticEnvironmentModifier.gd
          grep -q 'class_name WeatherPresentationRenderer' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'class_name WeatherAtmosphereSurface' game/scripts/render/WeatherAtmosphereSurface.gd
          grep -q 'PRESENTATION_STEP_SECONDS: float = 0.10' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'WEATHER_PIXEL_SIZE: int = 2' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'MAX_DEBRIS: int = 3' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'shader_atmosphere' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'cpu_continuous_redraws.*0' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'camera_motion_redraws.*0' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'set_camera_presentation' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'TIME \* rain_fps' game/shaders/weather_atmosphere.gdshader
          grep -q 'rain_pixel_size = 2.0' game/shaders/weather_atmosphere.gdshader
          grep -q 'sparse jittered macro-cells' game/shaders/weather_atmosphere.gdshader
          grep -q 'cluster_bias' game/shaders/weather_atmosphere.gdshader
          grep -q 'candidate_chance' game/shaders/weather_atmosphere.gdshader
          grep -q 'row_jitter' game/shaders/weather_atmosphere.gdshader
          ! grep -q 'floor(cell.y / 5.0)' game/shaders/weather_atmosphere.gdshader
          ! grep -q 'phase = mod(cell.y' game/shaders/weather_atmosphere.gdshader
          ! grep -q 'func _draw_rain' game/scripts/render/WeatherPresentationRenderer.gd
          ! grep -q 'func _draw_fog' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'transient_sky_light' game/scripts/simulation/lighting/AtmosphericOptics.gd
          grep -q 'target_within_visual_range' game/scripts/simulation/lighting/IlluminationVisualAcquisitionProvider.gd
          grep -q 'environment/defaults/default_clear_color=Color(0, 0, 0, 1)' game/project.godot
          grep -q '_weather.z_index = 50' game/scripts/render/TacticalRendererStack.gd
          grep -q '_perception.z_index = 100' game/scripts/render/TacticalRendererStack.gd
          grep -q 'layer = 35' game/scripts/ui/WeatherDevControls.gd
          grep -q 'panel.position = Vector2(344, 66)' game/scripts/ui/WeatherDevControls.gd
          ! grep -R -q 'PhysicalLightingService\|SpatialSoundService\|AcousticPropagationQuery\|ObserverPerceptionService' game/scripts/simulation/weather
          ! grep -R -q 'scripts/generation\|scripts/streaming' game/scripts/simulation/weather
          ! grep -R -q 'Sprite2D.new\|GPUParticles\|CPUParticles' game/scripts/render/WeatherPresentationRenderer.gd game/scripts/render/WeatherAtmosphereSurface.gd
          ! test -e game/scripts/simulation/weather/WeatherState.gd.tmp_DO_NOT_USE
          ! test -e game/scripts/simulation/weather/WeatherState2_IGNORE
          ! test -e NO_MORE_TEMP_IGNORE
          ! test -e TEMP_DO_NOT_CREATE
          ! test -e TEMP2_DO_NOT_CREATE
          ! test -e STOP
          ! test -e NO

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 28 Weather A/P3/P3B regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/WeatherSmoke.gd 2>&1 | tee "$RUNNER_TEMP/weather28-a.log"
          grep -q 'WEATHER_SMOKE_OK' "$RUNNER_TEMP/weather28-a.log"
          grep -q 'WEATHER_VIRTUAL_PIXELS=' "$RUNNER_TEMP/weather28-a.log"
          grep -q 'WEATHER_ACTIVE_DEBRIS=' "$RUNNER_TEMP/weather28-a.log"
          grep -q 'WEATHER_PRESENTATION_UPDATES=' "$RUNNER_TEMP/weather28-a.log"
          grep -q 'WEATHER_CPU_CONTINUOUS_REDRAWS=0' "$RUNNER_TEMP/weather28-a.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/weather28-a.log"; then exit 1; fi

      - name: System 28 Weather B environment integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/WeatherEnvironmentIntegrationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/weather28-b.log"
          grep -q 'WEATHER_B_INTEGRATION_SMOKE_OK' "$RUNNER_TEMP/weather28-b.log"
          grep -q 'WEATHER_B_CLEAR_RANGE=' "$RUNNER_TEMP/weather28-b.log"
          grep -q 'WEATHER_B_FOG_RANGE=' "$RUNNER_TEMP/weather28-b.log"
          grep -q 'WEATHER_B_STORM_HEARING_MASK=' "$RUNNER_TEMP/weather28-b.log"
          grep -q 'WEATHER_OVERLAY_CAMERA_REDRAWS=0' "$RUNNER_TEMP/weather28-b.log"
          grep -q 'WEATHER_OVERLAY_MASK_REBUILDS=' "$RUNNER_TEMP/weather28-b.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/weather28-b.log"; then exit 1; fi

      - name: System 28 Weather C lightning smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/WeatherLightningSmoke.gd 2>&1 | tee "$RUNNER_TEMP/weather28-c.log"
          grep -q 'WEATHER_C_LIGHTNING_SMOKE_OK' "$RUNNER_TEMP/weather28-c.log"
          grep -q 'WEATHER_C_LIGHTNING_BEFORE=' "$RUNNER_TEMP/weather28-c.log"
          grep -q 'WEATHER_C_LIGHTNING_FLASH=' "$RUNNER_TEMP/weather28-c.log"
          grep -q 'WEATHER_C_LIGHTNING_PORTAL=' "$RUNNER_TEMP/weather28-c.log"
          grep -q 'WEATHER_C_LIGHTNING_SEED=' "$RUNNER_TEMP/weather28-c.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/weather28-c.log"; then exit 1; fi

      - name: System 27 physical-lighting regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/PhysicalLightingSmoke.gd 2>&1 | tee "$RUNNER_TEMP/lighting27.log"
          grep -q 'PHYSICAL_LIGHTING_SMOKE_OK' "$RUNNER_TEMP/lighting27.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/lighting27.log"; then exit 1; fi

      - name: System 27 illumination-aware perception regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/IlluminationPerceptionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/lighting27-perception.log"
          grep -q 'ILLUMINATION_PERCEPTION_SMOKE_OK' "$RUNNER_TEMP/lighting27-perception.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/lighting27-perception.log"; then exit 1; fi

      - name: System 26 spatial-sound regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/SpatialSoundSmoke.gd 2>&1 | tee "$RUNNER_TEMP/sound26.log"
          grep -q 'SPATIAL_SOUND_SMOKE_OK' "$RUNNER_TEMP/sound26.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/sound26.log"; then exit 1; fi

      - name: System 23 perception regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerceptionFogMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOG_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED|Shader error' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 28 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system28-weather","description":"System 28 Weather Slices A+B+C + P3/P3B presentation","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
