name: Weather Atmosphere contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: weather-contract
  cancel-in-progress: true

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 28 Slice A boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/28_WEATHER_ATMOSPHERE.md
          test -f game/scripts/simulation/weather/WeatherProfile.gd
          test -f game/scripts/simulation/weather/WeatherState.gd
          test -f game/scripts/simulation/weather/WeatherService.gd
          test -f game/scripts/simulation/weather/SkyExposureQuery.gd
          test -f game/scripts/render/WeatherPresentationRenderer.gd
          test -f game/scripts/ui/WeatherDevControls.gd
          test -f game/scripts/ci/WeatherSmoke.gd
          grep -q 'class_name WeatherService' game/scripts/simulation/weather/WeatherService.gd
          grep -q 'class_name WeatherPresentationRenderer' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'PRESENTATION_STEP_SECONDS: float = 0.05' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q 'MAX_DEBRIS: int = 3' game/scripts/render/WeatherPresentationRenderer.gd
          grep -q '_weather.z_index = 50' game/scripts/render/TacticalRendererStack.gd
          grep -q '_perception.z_index = 100' game/scripts/render/TacticalRendererStack.gd
          ! grep -R -q 'AtmosphericOptics\|AcousticEnvironmentModifier\|LightningEvent' game/scripts/simulation/weather game/scripts/render/WeatherPresentationRenderer.gd
          ! grep -R -q 'scripts/generation\|scripts/streaming\|scripts/simulation/sound' game/scripts/simulation/weather
          ! grep -R -q 'Sprite2D.new\|GPUParticles\|CPUParticles' game/scripts/render/WeatherPresentationRenderer.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 28 weather smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/WeatherSmoke.gd 2>&1 | tee "$RUNNER_TEMP/weather28.log"
          grep -q 'WEATHER_SMOKE_OK' "$RUNNER_TEMP/weather28.log"
          grep -q 'WEATHER_VIRTUAL_PIXELS=' "$RUNNER_TEMP/weather28.log"
          grep -q 'WEATHER_ACTIVE_DEBRIS=' "$RUNNER_TEMP/weather28.log"
          grep -q 'WEATHER_PRESENTATION_UPDATES=' "$RUNNER_TEMP/weather28.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/weather28.log"; then exit 1; fi

      - name: System 27 physical-lighting regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/PhysicalLightingSmoke.gd 2>&1 | tee "$RUNNER_TEMP/lighting27.log"
          grep -q 'PHYSICAL_LIGHTING_SMOKE_OK' "$RUNNER_TEMP/lighting27.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/lighting27.log"; then exit 1; fi

      - name: System 23 perception regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerceptionFogMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOG_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED|Shader error' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 28 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system28-weather","description":"System 28 Weather Slice A","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
