name: Prompt Inventory Feedback

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/ui/CanonicalPlayerShell.gd'
      - 'game/scripts/ui/EquipmentPlayerShell.gd'
      - 'game/scripts/ci/PromptInventoryFeedbackSmoke.gd'
      - '.github/workflows/prompt-inventory-feedback.yml'
      - 'README_CONTEXT.md'
  workflow_dispatch:

jobs:
  inventory-feedback:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Prepare Godot project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify occupied inventory action feedback
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptInventoryFeedbackSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prompt-inventory-feedback.log"
          grep -q 'PROMPT_INVENTORY_FEEDBACK_SMOKE: PASS' "$RUNNER_TEMP/prompt-inventory-feedback.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prompt-inventory-feedback.log"; then exit 1; fi
