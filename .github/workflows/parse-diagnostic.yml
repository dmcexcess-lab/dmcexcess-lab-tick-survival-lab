name: One-shot Godot parse diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Capture import log
        shell: bash
        run: |
          set +e
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit > "$GITHUB_WORKSPACE/godot-import.log" 2>&1
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: godot-parse-log
          path: godot-import.log
