name: Publish exact-head workflow statuses

on:
  workflow_run:
    workflows:
      - Local Building Generation and Archetype Lab contract
      - Build and deploy Tick Survival Lab
    types: [completed]

permissions:
  contents: read
  statuses: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish source workflow conclusion on exact head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          case "$RUN_NAME" in
            "Local Building Generation and Archetype Lab contract")
              context="verify/system19-local-building"
              ;;
            "Build and deploy Tick Survival Lab")
              context="verify/pages-deploy"
              ;;
            *)
              echo "Unexpected source workflow: $RUN_NAME" >&2
              exit 1
              ;;
          esac

          state="failure"
          if [ "$RUN_CONCLUSION" = "success" ]; then
            state="success"
          fi

          description="$RUN_NAME: $RUN_CONCLUSION"
          description="${description:0:140}"
          export STATUS_STATE="$state"
          export STATUS_CONTEXT="$context"
          export STATUS_DESCRIPTION="$description"

          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATUS_STATE"],
              "target_url": os.environ["RUN_URL"],
              "description": os.environ["STATUS_DESCRIPTION"],
              "context": os.environ["STATUS_CONTEXT"],
          }))
          PY
          )"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -d "$payload"
