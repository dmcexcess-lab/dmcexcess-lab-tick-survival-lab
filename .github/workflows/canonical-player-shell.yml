name: Canonical Player Shell contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-player-shell-contract
  cancel-in-progress: true

jobs:
  canonical-player-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 16 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/16_CANONICAL_PLAYER_SHELL.md
          test -f game/scripts/ui/ActorStatsInspectorQuery.gd
          test -f game/scripts/ui/ActorInventoryInspectorQuery.gd
          test -f game/scripts/ui/CanonicalPlayerShell.gd
          test -f game/scripts/ci/CanonicalPlayerShellSmoke.gd
          grep -q 'Status: \*\*APPROVED\|Status: \*\*IMPLEMENTED' SYSTEM_DESIGNS/16_CANONICAL_PLAYER_SHELL.md
          grep -q 'CanonicalPlayerShell.gd' game/main.tscn
          grep -q 'STANCE_TOGGLE' game/scripts/input/PlayerActionIntent.gd
          grep -q 'KEY_C' game/scripts/input/KeyboardInputAdapter.gd
          grep -q 'set_enabled' game/scripts/input/KeyboardInputAdapter.gd
          grep -q 'set_enabled' game/scripts/ui/DemoMovementControls.gd
          ! grep -q 'WASD / arrows or touch' game/scripts/ui/DemoMovementControls.gd
          ! grep -q 'Tick %d' game/scripts/ui/DemoMovementControls.gd
          ! grep -R -q 'scripts/reboot' game/scripts/ui/ActorStatsInspectorQuery.gd game/scripts/ui/ActorInventoryInspectorQuery.gd game/scripts/ui/CanonicalPlayerShell.gd
          ! grep -R -q 'MutationService' game/scripts/ui/ActorStatsInspectorQuery.gd game/scripts/ui/ActorInventoryInspectorQuery.gd game/scripts/ui/CanonicalPlayerShell.gd
          ! grep -R -q 'simulation/items/transfer' game/scripts/ui/ActorStatsInspectorQuery.gd game/scripts/ui/ActorInventoryInspectorQuery.gd game/scripts/ui/CanonicalPlayerShell.gd
          ! grep -R -q 'scripts/render' game/scripts/ui/ActorStatsInspectorQuery.gd game/scripts/ui/ActorInventoryInspectorQuery.gd game/scripts/ui/CanonicalPlayerShell.gd
          ! grep -q 'get_tree().paused' game/scripts/ui/CanonicalPlayerShell.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Actor locomotion regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorLocomotionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/locomotion.log"
          grep -q 'ACTOR_LOCOMOTION_SMOKE_OK' "$RUNNER_TEMP/locomotion.log"

      - name: Actor status regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHealthSmoke.gd 2>&1 | tee "$RUNNER_TEMP/health.log"
          grep -q 'ACTOR_HEALTH_SMOKE_OK' "$RUNNER_TEMP/health.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorNeedsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/needs.log"
          grep -q 'ACTOR_NEEDS_SMOKE_OK' "$RUNNER_TEMP/needs.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorSkillsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/skills.log"
          grep -q 'ACTOR_SKILLS_SMOKE_OK' "$RUNNER_TEMP/skills.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorCarrySmoke.gd 2>&1 | tee "$RUNNER_TEMP/carry.log"
          grep -q 'ACTOR_CARRY_SMOKE_OK' "$RUNNER_TEMP/carry.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorMoodletsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/moodlets.log"
          grep -q 'ACTOR_MOODLETS_SMOKE_OK' "$RUNNER_TEMP/moodlets.log"

      - name: Hands and inventory regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHandEquipmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/hands.log"
          grep -q 'ACTOR_HAND_EQUIPMENT_SMOKE_OK' "$RUNNER_TEMP/hands.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/InventoryContainmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/inventory.log"
          grep -q 'INVENTORY_CONTAINMENT_SMOKE_OK' "$RUNNER_TEMP/inventory.log"

      - name: Canonical demo and HUD regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalDemoSmoke.gd 2>&1 | tee "$RUNNER_TEMP/demo.log"
          grep -q 'CANONICAL_DEMO_SMOKE_OK' "$RUNNER_TEMP/demo.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalHudSmoke.gd 2>&1 | tee "$RUNNER_TEMP/hud.log"
          grep -q 'CANONICAL_HUD_SMOKE_OK' "$RUNNER_TEMP/hud.log"

      - name: Canonical player shell integration smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalPlayerShellSmoke.gd 2>&1 | tee "$RUNNER_TEMP/shell.log"
          grep -q 'CANONICAL_PLAYER_SHELL_SMOKE_OK' "$RUNNER_TEMP/shell.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/shell.log"; then exit 1; fi

      - name: Canonical demo startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
