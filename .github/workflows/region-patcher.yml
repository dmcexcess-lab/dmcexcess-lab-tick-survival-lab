name: One-shot procedural region integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[region-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch preview for procedural region and zoom
        shell: python
        run: |
          from pathlib import Path
          p = Path('game/scripts/MapPreview.gd')
          s = p.read_text()

          s = s.replace(
              'const MapGen = preload("res://scripts/TacticalMapGenerator.gd")\n',
              'const MapGen = preload("res://scripts/TacticalMapGenerator.gd")\nconst RegionGen = preload("res://scripts/ProceduralRegionGenerator.gd")\n'
          )
          s = s.replace(
              'const TILE := 31.0\nconst VISIBLE_COLS := 18\nconst VISIBLE_ROWS := 16\n',
              'const ZOOM_PRESETS := [[28.0, 20, 17], [31.0, 18, 16], [35.0, 16, 14], [39.0, 14, 12]]\nvar TILE := 35.0\nvar VISIBLE_COLS := 16\nvar VISIBLE_ROWS := 14\nvar zoom_index := 2\n'
          )
          s = s.replace(
              'const BTN_BACK := Rect2(462, CONTROL_ROW_BOTTOM_Y, CONTROL_SIDE_W, VIEW_H - CONTROL_ROW_BOTTOM_Y - 8.0)\n',
              'const BTN_BACK := Rect2(462, CONTROL_ROW_BOTTOM_Y, CONTROL_SIDE_W, VIEW_H - CONTROL_ROW_BOTTOM_Y - 8.0)\nconst BTN_ZOOM_OUT := Rect2(218, 718, 78, 52)\nconst BTN_ZOOM_IN := Rect2(344, 718, 78, 52)\n'
          )
          s = s.replace(
              'var variant := 0\nvar spec: Dictionary = {}\n',
              'var variant := 0\nvar region_seed := 0\nvar spec: Dictionary = {}\n'
          )
          old = '''func reroll() -> void:\n    environment_id = MapGen.pick_random(rng)\n    variant = MapGen.pick_variant(environment_id, rng)\n    spec = MapGen.build_layout(environment_id, variant)\n'''
          new = '''func reroll() -> void:\n    region_seed = rng.randi_range(1, 2147483646)\n    environment_id = "procedural_region"\n    variant = 0\n    spec = RegionGen.generate(region_seed)\n'''
          if old not in s:
              raise SystemExit('reroll block not found')
          s = s.replace(old, new)

          s = s.replace(
              '        if key_event.keycode == KEY_6:\n            _cycle_weather(); get_viewport().set_input_as_handled(); return\n',
              '        if key_event.keycode == KEY_6:\n            _cycle_weather(); get_viewport().set_input_as_handled(); return\n        if key_event.keycode in [KEY_EQUAL, KEY_KP_ADD]:\n            _zoom(1); get_viewport().set_input_as_handled(); return\n        if key_event.keycode in [KEY_MINUS, KEY_KP_SUBTRACT]:\n            _zoom(-1); get_viewport().set_input_as_handled(); return\n'
          )

          marker = '''func _cycle_weather() -> void:\n'''
          zoom_func = '''func _zoom(delta: int) -> void:\n    zoom_index = clampi(zoom_index + delta, 0, ZOOM_PRESETS.size() - 1)\n    var preset: Array = ZOOM_PRESETS[zoom_index]\n    TILE = float(preset[0])\n    VISIBLE_COLS = int(preset[1])\n    VISIBLE_ROWS = int(preset[2])\n    _record_zero("zoom", "%dx%d @ %.0fpx" % [VISIBLE_COLS, VISIBLE_ROWS, TILE])\n\n'''
          if marker not in s:
              raise SystemExit('weather marker not found')
          s = s.replace(marker, zoom_func + marker, 1)

          s = s.replace(
              '    if BTN_CROUCH.has_point(pos):\n        _toggle_crouch(); return\n',
              '    if BTN_CROUCH.has_point(pos):\n        _toggle_crouch(); return\n    if BTN_ZOOM_OUT.has_point(pos):\n        _zoom(-1); return\n    if BTN_ZOOM_IN.has_point(pos):\n        _zoom(1); return\n'
          )

          s = s.replace(
              '    if target.x < 0 or target.y < 0 or target.x >= MapGen.BOARD_W or target.y >= MapGen.BOARD_H:\n',
              '    if target.x < 0 or target.y < 0 or target.x >= _map_w() or target.y >= _map_h():\n'
          )
          s = s.replace(
              '    if cell.x < 0 or cell.y < 0 or cell.x >= MapGen.BOARD_W or cell.y >= MapGen.BOARD_H:\n',
              '    if cell.x < 0 or cell.y < 0 or cell.x >= _map_w() or cell.y >= _map_h():\n'
          )
          s = s.replace(
              '    draw_string(font, Vector2(12, 124), "%s v%d" % [MapGen.display_name(environment_id), variant], HORIZONTAL_ALIGNMENT_LEFT, -1, 9, Color("7f918b"))\n',
              '    draw_string(font, Vector2(12, 124), "%s | seed %d" % [str(spec.get("display_name", MapGen.display_name(environment_id))), region_seed], HORIZONTAL_ALIGNMENT_LEFT, -1, 9, Color("7f918b"))\n'
          )
          s = s.replace(
              '    _draw_button(BTN_BACK, "BACK", false, 11)\n    draw_string(font, Vector2(210, 690), "World controls", HORIZONTAL_ALIGNMENT_CENTER, 220, 11, Color("84928c"))\n',
              '    _draw_button(BTN_BACK, "BACK", false, 11)\n    _draw_button(BTN_ZOOM_OUT, "-", zoom_index > 0, 20)\n    _draw_button(BTN_ZOOM_IN, "+", zoom_index < ZOOM_PRESETS.size() - 1, 20)\n    draw_string(font, Vector2(210, 690), "World controls", HORIZONTAL_ALIGNMENT_CENTER, 220, 11, Color("84928c"))\n    draw_string(font, Vector2(296, 751), "ZOOM", HORIZONTAL_ALIGNMENT_CENTER, 48, 9, Color("84928c"))\n'
          )

          old_view = '''func _view_origin() -> Vector2i:\n    var max_x: int = maxi(0, MapGen.BOARD_W - VISIBLE_COLS)\n    var max_y: int = maxi(0, MapGen.BOARD_H - VISIBLE_ROWS)\n'''
          new_view = '''func _map_w() -> int:\n    return int(spec.get("width", MapGen.BOARD_W))\n\nfunc _map_h() -> int:\n    return int(spec.get("height", MapGen.BOARD_H))\n\nfunc _view_origin() -> Vector2i:\n    var max_x: int = maxi(0, _map_w() - VISIBLE_COLS)\n    var max_y: int = maxi(0, _map_h() - VISIBLE_ROWS)\n'''
          if old_view not in s:
              raise SystemExit('view origin block not found')
          s = s.replace(old_view, new_view)

          p.write_text(s)

          c = Path('README_CONTEXT.md')
          cs = c.read_text()
          add = '''\n## Procedural region foundation\n\nThe current large-map stress slice uses `ProceduralRegionGenerator.gd` to build a deterministic 64×64 local region. It is deliberately a region/chunk prototype, not the final island size. The generator assigns residential, commercial, downtown, woods, and rural zones from seeded spatial centers, lays arterial/secondary roads, then applies biome-specific parcel/structure rules. Existing physical map facts (ground, indoor rectangles, walls, doors, glass, obstacles, props, lights, exits) remain the shared schema.\n\nScaling rule: world generation may cover large deterministic regions, but rendering, lighting, perception and eventually actor simulation must stay local/chunked around active areas. The final island should be composed from deterministic regions/chunks rather than represented as one permanently active mega-array.\n\nThe Web harness currently defaults to a 64×64 procedural region and exposes player-controlled map zoom. Zoom changes presentation only; world coordinates, movement cost, LOS and simulation geometry do not change.\n'''
          if '## Procedural region foundation' not in cs:
              cs += add
          c.write_text(cs)

          ch = Path('CHANGELOG.md')
          text = ch.read_text()
          entry = '''## Procedural Region / Player Zoom / Safari First-Touch Fix — 2026-08-14\n\n- Added a deterministic 64×64 procedural region stress slice with residential, commercial, downtown, woods, and rural zoning.\n- Added seeded road hierarchy and biome-specific parcel/structure/decor rules while preserving the existing physical map schema.\n- Generalized local-world bounds and perception dimensions for maps larger than the original 20×18 authored locations.\n- Bounded lighting/perception work around the player so larger generated regions do not require full-map visibility scans each action.\n- Added player-controlled map zoom with four presentation levels; zoom does not alter world/simulation coordinates.\n- Added a Web touch autoload that detects touch-capable browsers up front and swallows synthetic mouse clicks, including the first-click-before-first-touch Safari case.\n- Added deterministic region generation smoke coverage.\n\n'''
          if '## Procedural Region / Player Zoom / Safari First-Touch Fix' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry)
          ch.write_text(text)

      - name: Commit integration
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/MapPreview.gd README_CONTEXT.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Integrate procedural region and player zoom [region-patched]"
          git push origin HEAD:main
