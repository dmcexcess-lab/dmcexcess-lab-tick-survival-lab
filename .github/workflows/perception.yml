name: Perception LOS Fog Memory contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perception-los-fog-memory-contract
  cancel-in-progress: true

jobs:
  perception:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 23 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/23_PERCEPTION_LOS_FOG_MEMORY.md
          test -f game/scripts/simulation/perception/VisionProfile.gd
          test -f game/scripts/simulation/perception/VisionQuery.gd
          test -f game/scripts/simulation/perception/PerceptionMemoryStore.gd
          test -f game/scripts/simulation/perception/ObserverPerceptionService.gd
          test -f game/scripts/render/PerceptionOverlayRenderer.gd
          test -f game/scripts/demo/DemoAmbientLightCycle.gd
          test -f game/scripts/ci/PerceptionFogMemorySmoke.gd
          test -f game/scripts/ci/PerceptionAmbientMemorySmoke.gd
          grep -q 'MEMORY_NIGHT_LUMINANCE' game/scripts/render/PerceptionOverlayRenderer.gd
          grep -q 'set_perception_ambient_light_level' game/scripts/render/TacticalRendererStack.gd
          ! grep -R -q 'func _process\|func _physics_process' game/scripts/simulation/perception game/scripts/render/PerceptionOverlayRenderer.gd
          ! grep -R -q 'scripts/simulation/collision\|scripts/generation\|scripts/streaming' game/scripts/simulation/perception
          ! grep -R -q 'WorldMutationService\|DoorStateMutationService' game/scripts/simulation/perception game/scripts/render/PerceptionOverlayRenderer.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 23 perception contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerceptionFogMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOG_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOV_BENCH_AVG_US=' "$RUNNER_TEMP/perception23.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23.log"; then exit 1; fi

      - name: System 23 ambient remembered-fog smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/PerceptionAmbientMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23-ambient.log"
          grep -q 'PERCEPTION_AMBIENT_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23-ambient.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23-ambient.log"; then exit 1; fi

      - name: Door state and interaction regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/DoorInteractionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/door18.log"
          grep -q 'DOOR_INTERACTION_SMOKE_OK' "$RUNNER_TEMP/door18.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/door18.log"; then exit 1; fi

      - name: Ground structure actor renderer regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/GroundLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/ground05.log"
          grep -q 'GROUND_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/ground05.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/StructureLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/structure06.log"
          grep -q 'STRUCTURE_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/structure06.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/ActorLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/actor08.log"
          grep -q 'ACTOR_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/actor08.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/ground05.log" "$RUNNER_TEMP/structure06.log" "$RUNNER_TEMP/actor08.log"; then exit 1; fi

      - name: Camera regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/CameraViewControlSmoke.gd 2>&1 | tee "$RUNNER_TEMP/camera21.log"
          grep -q 'CAMERA_VIEW_CONTROL_SMOKE_OK' "$RUNNER_TEMP/camera21.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/camera21.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
