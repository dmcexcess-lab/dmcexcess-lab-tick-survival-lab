name: World Loot Searchable Containers contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: world-loot-searchable-containers-contract
  cancel-in-progress: true

jobs:
  world-loot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 24 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/24_WORLD_LOOT_SEARCHABLE_CONTAINERS.md
          test -f game/scripts/simulation/items/transfer/ItemContainerAccessPolicy.gd
          test -f game/scripts/simulation/items/transfer/PolicyAwareItemTransferActionService.gd
          test -f game/scripts/simulation/interaction/WorldInteractionReachQuery.gd
          test -f game/scripts/simulation/loot/LootItemCatalog.gd
          test -f game/scripts/simulation/loot/LootContainerProfileCatalog.gd
          test -f game/scripts/simulation/loot/LootState.gd
          test ! -f game/scripts/simulation/loot/LootInteractionReach.gd
          test -f game/scripts/simulation/loot/LootWorldContainerAccessPolicy.gd
          test -f game/scripts/simulation/loot/LootSourceInitializer.gd
          test -f game/scripts/simulation/loot/LootSearchActionService.gd
          test -f game/scripts/simulation/loot/LootContainerInspectionQuery.gd
          test -f game/scripts/player/LootPlayerInteractionController.gd
          test -f game/scripts/ui/LootContainerPanel.gd
          test -f game/scripts/ci/WorldLootSmoke.gd
          grep -q 'class_name LootState' game/scripts/simulation/loot/LootState.gd
          grep -q 'USABLE' game/scripts/simulation/loot/LootItemCatalog.gd
          grep -q 'JUNK' game/scripts/simulation/loot/LootItemCatalog.gd
          grep -q 'scavenge.search_container' game/scripts/simulation/loot/LootSearchActionService.gd
          grep -q 'WorldInteractionReachQuery' game/scripts/simulation/loot/LootSearchActionService.gd
          grep -q 'WorldInteractionReachQuery' game/scripts/simulation/loot/LootWorldContainerAccessPolicy.gd
          grep -q 'InterruptionPolicy.CANCELABLE' game/scripts/simulation/loot/LootSearchActionService.gd
          grep -q 'entity_id_for_role' game/scripts/generation/buildings/GeneratedBuildingPlan.gd
          grep -q 'PolicyAwareItemTransferActionService' game/scripts/simulation/items/transfer/PolicyAwareItemTransferActionService.gd
          ! grep -R -q 'scripts/render' game/scripts/simulation/loot
          ! grep -R -q 'scripts/input' game/scripts/simulation/loot
          ! grep -R -q 'scripts/camera' game/scripts/simulation/loot
          ! grep -R -q 'scripts/simulation/combat' game/scripts/simulation/loot

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 24 world loot contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/WorldLootSmoke.gd 2>&1 | tee "$RUNNER_TEMP/world-loot.log"
          grep -q 'WORLD_LOOT_SMOKE_OK' "$RUNNER_TEMP/world-loot.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/world-loot.log"; then exit 1; fi

      - name: Inventory containment regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/InventoryContainmentSmoke.gd 2>&1 | tee "$RUNNER_TEMP/inventory11.log"
          grep -q 'INVENTORY_CONTAINMENT_SMOKE_OK' "$RUNNER_TEMP/inventory11.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/inventory11.log"; then exit 1; fi

      - name: Item transfer and carry regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/ItemTransferActionsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/item12.log"
          grep -q 'ITEM_TRANSFER_ACTIONS_SMOKE_OK' "$RUNNER_TEMP/item12.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/ActorCarryAcquisitionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/carry13e.log"
          grep -q 'ACTOR_CARRY_ACQUISITION_SMOKE_OK' "$RUNNER_TEMP/carry13e.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/item12.log" "$RUNNER_TEMP/carry13e.log"; then exit 1; fi

      - name: System 19 building regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/LocalBuildingGenerationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/building19.log"
          grep -q 'LOCAL_BUILDING_GENERATION_SMOKE_OK' "$RUNNER_TEMP/building19.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/building19.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 24 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system24-loot","description":"System 24 world loot contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
