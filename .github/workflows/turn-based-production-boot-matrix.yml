name: Turn-based production boot matrix
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: turn-based-production-boot-matrix
  cancel-in-progress: true
jobs:
  production-boot-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.1-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.1-stable_linux.x86_64 /usr/local/bin/godot
      - name: Build script class cache
        working-directory: game
        run: godot --headless --editor --quit
      - name: Verify full canonical production boot
        working-directory: game
        run: godot --headless --script res://scripts/ci/TurnBasedProductionBootMatrixSmoke.gd
      - name: Guard simple turn game from legacy simulation execution
        run: |
          grep -q '^extends GameMain$' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'EnvironmentalPressureGameMain' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'UtilityGameMain' game/scripts/app/TurnBasedGameMain.gd
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'MovementActionService' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'run_next_batch\|run_until_stop' game/scripts/player/SimpleTurnController.gd
