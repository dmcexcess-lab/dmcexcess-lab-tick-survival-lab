name: Procedural Island Failure Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit

      - name: Category site-unrepairable
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "island_base_site_unrepairable:"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category site-overlap
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "island_base_site_overlap:"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category world-validation
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "island_world_validation_failed:"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category power
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "island_power_"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category road-clipping
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "island_road_clipping_failed"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category base-world
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "island_base_world_generation_failed:"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category bridge-input
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "invalid_bridge_intent_input"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category bridge-overlap
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "global_road_river_collinear_overlap"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd

      - name: Category bridge-missing
        continue-on-error: true
        env:
          TICK_LAB_EXPECT_FAILURE_PREFIX: "global_bridge_intent_missing"
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
