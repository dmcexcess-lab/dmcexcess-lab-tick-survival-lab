name: Procedural Island Failure Diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit

      - name: seed 997 site-unrepairable
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "island_base_site_unrepairable:" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 site-overlap
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "island_base_site_overlap:" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 world-validation
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "island_world_validation_failed:" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 power
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "island_power_" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 road-clipping
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "island_road_clipping_failed" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 base-world
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "island_base_world_generation_failed:" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 bridge-input
        if: always()
        env: { TICK_LAB_SEED: "997", TICK_LAB_EXPECT_FAILURE_PREFIX: "invalid_bridge_intent_input" }
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ProceduralIslandFailureClassifier.gd
      - name: seed 997 bridge-overlap
