name: Prompt road hierarchy realism

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/generation/world/IslandMajorRoadNetworkPlanner.gd'
      - 'game/scripts/ci/PromptRoadHierarchyRealismSmoke.gd'
      - 'game/scripts/ci/IslandRoadHierarchySmoke.gd'
      - '.github/workflows/prompt-road-hierarchy-realism.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  road-hierarchy-realism:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit

      - name: Verify prompt road hierarchy acceptance
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptRoadHierarchyRealismSmoke.gd

      - name: Verify permanent road hierarchy regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/IslandRoadHierarchySmoke.gd
