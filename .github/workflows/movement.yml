name: Movement Actions contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: movement-actions-contract
  cancel-in-progress: true

jobs:
  movement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate movement source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/02_MOVEMENT_ACTIONS.md
          test -f game/scripts/simulation/movement/MovementActionResult.gd
          test -f game/scripts/simulation/movement/MovementTraversalPolicy.gd
          test -f game/scripts/simulation/movement/MovementActionService.gd
          test -f game/scripts/ci/MovementActionsSmoke.gd
          grep -q 'class_name MovementActionResult' game/scripts/simulation/movement/MovementActionResult.gd
          grep -q 'class_name MovementTraversalPolicy' game/scripts/simulation/movement/MovementTraversalPolicy.gd
          grep -q 'class_name MovementActionService' game/scripts/simulation/movement/MovementActionService.gd
          grep -q 'movement.commit' game/scripts/simulation/movement/MovementActionService.gd
          ! grep -R -q 'scripts/reboot' game/scripts/simulation/movement
          ! grep -R -q 'scripts/render' game/scripts/simulation/movement
          ! grep -R -q 'scripts/input' game/scripts/simulation/movement
          ! grep -R -q 'scripts/generation' game/scripts/simulation/movement

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Movement actions contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/MovementActionsSmoke.gd 2>&1 | tee "$RUNNER_TEMP/movement-actions-smoke.log"
          grep -q 'MOVEMENT_ACTIONS_SMOKE_OK' "$RUNNER_TEMP/movement-actions-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/movement-actions-smoke.log"; then exit 1; fi
