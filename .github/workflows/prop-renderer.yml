name: Prop Fixture Vegetation Renderer contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prop-fixture-vegetation-renderer-contract
  cancel-in-progress: true

jobs:
  prop-renderer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prop renderer source boundary
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/07_PROP_FIXTURE_VEGETATION_RENDERER.md
          test -f game/scripts/art/PropArtOrientationCatalog.gd
          test -f game/scripts/render/PropDrawCommand.gd
          test -f game/scripts/render/PropLayerRenderer.gd
          test -f game/scripts/ci/PropLayerRendererSmoke.gd
          test -f game/scripts/ci/PropArtOrientationSmoke.gd
          grep -q 'class_name PropArtOrientationCatalog' game/scripts/art/PropArtOrientationCatalog.gd
          grep -q 'class_name PropDrawCommand' game/scripts/render/PropDrawCommand.gd
          grep -q 'class_name PropLayerRenderer' game/scripts/render/PropLayerRenderer.gd
          grep -q 'plan_visible_commands' game/scripts/render/PropLayerRenderer.gd
          grep -q 'draw_texture_rect_region' game/scripts/render/PropLayerRenderer.gd
          grep -q 'draw_set_transform' game/scripts/render/PropLayerRenderer.gd
          grep -q 'PropArtOrientationCatalog' game/scripts/render/PropLayerRenderer.gd
          grep -q 'Channel.OBJECT' game/scripts/render/PropLayerRenderer.gd
          ! grep -R -q 'scripts/reboot' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/generation' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/simulation' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/foundation/time' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/camera' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/input' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/ui' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/perception' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'scripts/inventory' game/scripts/render/Prop*.gd game/scripts/art/PropArtOrientationCatalog.gd
          ! grep -R -q 'GroundLayerRenderer' game/scripts/render/Prop*.gd
          ! grep -R -q 'StructureLayerRenderer' game/scripts/render/Prop*.gd
          ! grep -R -q '_process' game/scripts/render/PropLayerRenderer.gd
          ! grep -E -q 'tactical_atlas|clutter_atlas|world_art_atlas|building_props_atlas|final_environment' game/scripts/render/Prop*.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Recovered art catalog regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ArtCatalogSmoke.gd 2>&1 | tee "$RUNNER_TEMP/art-catalog-smoke.log"
          grep -q 'ART_CATALOG_SMOKE_OK' "$RUNNER_TEMP/art-catalog-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/art-catalog-smoke.log"; then exit 1; fi

      - name: Prop art orientation contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PropArtOrientationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prop-orientation-smoke.log"
          grep -q 'PROP_ART_ORIENTATION_SMOKE_OK' "$RUNNER_TEMP/prop-orientation-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prop-orientation-smoke.log"; then exit 1; fi

      - name: Ground renderer regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/GroundLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/ground-smoke.log"
          grep -q 'GROUND_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/ground-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/ground-smoke.log"; then exit 1; fi

      - name: Structure renderer regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/StructureLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/structure-smoke.log"
          grep -q 'STRUCTURE_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/structure-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/structure-smoke.log"; then exit 1; fi

      - name: Prop fixture vegetation renderer contract smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PropLayerRendererSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prop-smoke.log"
          grep -q 'PROP_LAYER_RENDERER_SMOKE_OK' "$RUNNER_TEMP/prop-smoke.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prop-smoke.log"; then exit 1; fi
