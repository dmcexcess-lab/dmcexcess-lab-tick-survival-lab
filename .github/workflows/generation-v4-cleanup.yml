name: Finalize generation v4

"on":
  push:
    paths:
      - '.github/workflows/generation-v4-cleanup.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply coordinate and documentation cleanup
        shell: bash
        run: python3 .generation_v4_cleanup.py
      - name: Commit cleanup and remove temporary writer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .generation_v4_cleanup.py .github/workflows/generation-v4-cleanup.yml
          git add game/scripts/ProceduralRegionGenerator.gd WORLD_GENERATION.md README_CONTEXT.md CHANGELOG.md
          git commit -m 'Finalize generation v4 rules and docs'
          git push origin HEAD:main
