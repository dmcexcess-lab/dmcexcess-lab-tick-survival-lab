name: Prompt World Boundary

on:
  push:
    branches: [main]
    paths:
      - 'game/scripts/view/**'
      - 'game/scripts/app/GameMain.gd'
      - 'game/scripts/demo/GeneratedIslandCritiqueFixture.gd'
      - 'game/scripts/ci/PromptWorldBoundarySmoke.gd'
      - '.github/workflows/prompt-world-boundary.yml'
      - 'README_CONTEXT.md'
  workflow_dispatch:

jobs:
  world-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Prepare Godot project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify island render boundary
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptWorldBoundarySmoke.gd 2>&1 | tee "$RUNNER_TEMP/prompt-world-boundary.log"
          grep -q 'PROMPT_WORLD_BOUNDARY_SMOKE: PASS' "$RUNNER_TEMP/prompt-world-boundary.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prompt-world-boundary.log"; then exit 1; fi
