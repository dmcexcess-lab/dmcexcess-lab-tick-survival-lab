name: Item Freshness Spoilage contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: item-freshness-spoilage-contract
  cancel-in-progress: true

jobs:
  item-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 30 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/30_ITEM_FRESHNESS_SPOILAGE.md
          test -f game/scripts/simulation/items/freshness/ItemFreshnessProfile.gd
          test -f game/scripts/simulation/items/freshness/ItemFreshnessProfileCatalog.gd
          test -f game/scripts/simulation/items/freshness/ItemFreshnessRecord.gd
          test -f game/scripts/simulation/items/freshness/ItemFreshnessState.gd
          test -f game/scripts/simulation/items/freshness/SpoilageEnvironmentProvider.gd
          test -f game/scripts/simulation/items/freshness/AmbientSpoilageEnvironmentProvider.gd
          test -f game/scripts/simulation/items/freshness/ItemFreshnessQuery.gd
          test -f game/scripts/simulation/items/freshness/ItemFreshnessMutationService.gd
          test -f game/scripts/ci/ItemFreshnessSmoke.gd
          test -f game/scripts/ci/ItemFreshnessTestLootProfileCatalog.gd
          grep -q 'FRESH: StringName' game/scripts/simulation/items/freshness/ItemFreshnessQuery.gd
          grep -q 'AGING: StringName' game/scripts/simulation/items/freshness/ItemFreshnessQuery.gd
          grep -q 'STALE: StringName' game/scripts/simulation/items/freshness/ItemFreshnessQuery.gd
          grep -q 'SPOILED: StringName' game/scripts/simulation/items/freshness/ItemFreshnessQuery.gd
          grep -q 'exposure_ticks_at' game/scripts/simulation/items/freshness/AmbientSpoilageEnvironmentProvider.gd
          grep -q 'origin_world_tick' game/scripts/simulation/items/freshness/ItemFreshnessRecord.gd
          grep -q '_freshness_mutations' game/scripts/simulation/loot/LootSourceInitializer.gd
          grep -q 'snapshot_state' game/scripts/simulation/loot/LootSourceInitializer.gd
          grep -q '_freshness_query' game/scripts/app/GameMain.gd
          grep -q '_freshness_mutations' game/scripts/app/GameMain.gd
          ! grep -R -q 'func _process\|func _physics_process' game/scripts/simulation/items/freshness
          ! grep -R -q 'schedule_event\|begin_action' game/scripts/simulation/items/freshness
          ! grep -R -q 'scripts/simulation/weather\|scripts/simulation/lighting\|scripts/simulation/actors/health' game/scripts/simulation/items/freshness

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 30 freshness smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/ItemFreshnessSmoke.gd 2>&1 | tee "$RUNNER_TEMP/freshness30.log"
          grep -q 'ITEM_FRESHNESS_SMOKE_OK' "$RUNNER_TEMP/freshness30.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/freshness30.log"; then exit 1; fi

      - name: System 24 loot regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/WorldLootSmoke.gd 2>&1 | tee "$RUNNER_TEMP/loot24.log"
          grep -q 'WORLD_LOOT_SMOKE_OK' "$RUNNER_TEMP/loot24.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/loot24.log"; then exit 1; fi

      - name: System 25 time regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 20 --script res://scripts/ci/WorldTimeAmbientSmoke.gd 2>&1 | tee "$RUNNER_TEMP/time25.log"
          grep -q 'WORLD_TIME_AMBIENT_SMOKE_OK' "$RUNNER_TEMP/time25.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/time25.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 30 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system30-item-freshness","description":"System 30 item freshness contract","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
