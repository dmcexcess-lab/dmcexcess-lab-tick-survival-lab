name: Physical Lighting Illumination contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: physical-lighting-contract
  cancel-in-progress: true

jobs:
  physical-lighting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 27 Slice A+B+C boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/27_PHYSICAL_LIGHTING_ILLUMINATION_SHADOWS.md
          test -f game/scripts/simulation/lighting/AtmosphericOptics.gd
          test -f game/scripts/simulation/lighting/LightEmitterProfile.gd
          test -f game/scripts/simulation/lighting/LightEmitter.gd
          test -f game/scripts/simulation/lighting/IlluminationSample.gd
          test -f game/scripts/simulation/lighting/VisionLightRangePolicy.gd
          test -f game/scripts/simulation/lighting/PhysicalLightingService.gd
          test -f game/scripts/simulation/lighting/IlluminationVisualAcquisitionProvider.gd
          test -f game/scripts/simulation/perception/VisualAcquisitionProvider.gd
          test -f game/scripts/render/PhysicalLightingPresentationRenderer.gd
          test -f game/scripts/demo/DemoLightingSourceAdapter.gd
          test -f game/shaders/physical_lighting_multiply.gdshader
          test -f game/shaders/physical_lighting_glow.gdshader
          test -f game/scripts/ci/PhysicalLightingSmoke.gd
          test -f game/scripts/ci/PhysicalLightingPresentationSmoke.gd
          test -f game/scripts/ci/IlluminationPerceptionSmoke.gd
          grep -q 'class_name PhysicalLightingService' game/scripts/simulation/lighting/PhysicalLightingService.gd
          grep -q 'class_name PhysicalLightingPresentationRenderer' game/scripts/render/PhysicalLightingPresentationRenderer.gd
          grep -q 'class_name IlluminationVisualAcquisitionProvider' game/scripts/simulation/lighting/IlluminationVisualAcquisitionProvider.gd
          grep -q 'class_name DemoLightingSourceAdapter' game/scripts/demo/DemoLightingSourceAdapter.gd
          grep -q 'effective_range_for_luminance' game/scripts/simulation/lighting/VisionLightRangePolicy.gd
          grep -q 'wall produces physical flashlight shadow' game/scripts/ci/PhysicalLightingSmoke.gd
          grep -q 'presentation uses backend flashlight shadow' game/scripts/ci/PhysicalLightingPresentationSmoke.gd
          grep -q 'physical target illumination expands actual acquired vision' game/scripts/ci/IlluminationPerceptionSmoke.gd
          grep -q 'render_mode unshaded, blend_mul' game/shaders/physical_lighting_multiply.gdshader
          grep -q 'render_mode unshaded, blend_add' game/shaders/physical_lighting_glow.gdshader
          grep -q '_lighting.z_index = 40' game/scripts/render/TacticalRendererStack.gd
          grep -q '_perception.z_index = 100' game/scripts/render/TacticalRendererStack.gd
          ! grep -R -q 'PointLight2D\|LightOccluder2D\|CanvasModulate' game/scripts/simulation/lighting
          ! grep -R -q 'scripts/generation\|scripts/streaming\|scripts/simulation/sound\|scripts/simulation/loot\|scripts/simulation/combat' game/scripts/simulation/lighting
          ! grep -R -q 'func _process\|func _physics_process' game/scripts/simulation/lighting

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: System 27 physical lighting smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/PhysicalLightingSmoke.gd 2>&1 | tee "$RUNNER_TEMP/lighting27.log"
          grep -q 'PHYSICAL_LIGHTING_SMOKE_OK' "$RUNNER_TEMP/lighting27.log"
          grep -q 'PHYSICAL_LIGHTING_REBUILD_AVG_US=' "$RUNNER_TEMP/lighting27.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/lighting27.log"; then exit 1; fi

      - name: System 27 rich presentation smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 60 --script res://scripts/ci/PhysicalLightingPresentationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/lighting27-presentation.log"
          grep -q 'PHYSICAL_LIGHTING_PRESENTATION_SMOKE_OK' "$RUNNER_TEMP/lighting27-presentation.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/lighting27-presentation.log"; then exit 1; fi

      - name: System 27 illumination-aware perception smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/IlluminationPerceptionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/lighting27-perception.log"
          grep -q 'ILLUMINATION_PERCEPTION_SMOKE_OK' "$RUNNER_TEMP/lighting27-perception.log"
          grep -q 'PERCEPTION_LIGHTING_RECOMPUTE_AVG_US=' "$RUNNER_TEMP/lighting27-perception.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|Shader error' "$RUNNER_TEMP/lighting27-perception.log"; then exit 1; fi

      - name: System 25 world-time regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/WorldTimeAmbientSmoke.gd 2>&1 | tee "$RUNNER_TEMP/time25.log"
          grep -q 'WORLD_TIME_AMBIENT_SMOKE_OK' "$RUNNER_TEMP/time25.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/time25.log"; then exit 1; fi

      - name: System 23 perception regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/PerceptionFogMemorySmoke.gd 2>&1 | tee "$RUNNER_TEMP/perception23.log"
          grep -q 'PERCEPTION_FOG_MEMORY_SMOKE_OK' "$RUNNER_TEMP/perception23.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/perception23.log"; then exit 1; fi

      - name: Canonical demo startup regression
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED|Shader error' "$RUNNER_TEMP/startup.log"; then exit 1; fi

      - name: Publish System 27 exact-head status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
            *) state=error ;;
          esac
          payload=$(printf '{"state":"%s","context":"verify/system27-physical-lighting","description":"System 27 physical lighting Slices A+B+C","target_url":"%s"}' "$state" "$RUN_URL")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            -d "$payload"
