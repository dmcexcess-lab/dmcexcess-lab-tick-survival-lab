name: Performance gate docs closure

on:
  push:
    branches:
      - perf-docs-close

permissions:
  contents: write

jobs:
  close-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs branch
        uses: actions/checkout@v4
        with:
          ref: perf-docs-close
          fetch-depth: 0

      - name: Close performance gate documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          EXEC = "0398a2a49d84e6067f7610727aecacf4c05fe41f"

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} matches, found {found}")
              p.write_text(text.replace(old, new, count))

          # Canonical performance design.
          path = 'SYSTEM_DESIGNS/PERFORMANCE_ARCHITECTURE.md'
          replace(path,
              'Status: **APPROVED — P0/P1/P2 first executable pass**',
              'Status: **IMPLEMENTED + CI VERIFIED — P0/P1/P2 first executable pass**')
          replace(path,
              'Approved: **2026-08-24**',
              'Approved: **2026-08-24**\n\nImplemented / exact-head verified: **2026-08-24**\n\nFirst fully green executable head: `0398a2a49d84e6067f7610727aecacf4c05fe41f`.')
          replace(path,
              'Focused contract proves a 128-object batch emits one completed summary, OBJECT revision changes without terrain/STRUCTURE revision changes, ACTOR/OBJECT churn causes zero lighting-geometry/sample and shelter-mask rebuilds, while a real STRUCTURE change still causes exactly one rebuild after query. Existing performance, lighting, streaming, interaction and startup regressions remain protected.',
              'Focused contract proves a 128-object batch emits one completed summary, OBJECT revision changes without terrain/STRUCTURE revision changes, ACTOR/OBJECT churn causes zero lighting-geometry/sample and shelter-mask rebuilds, while a real STRUCTURE change still causes exactly one rebuild after query. Existing performance, lighting, streaming, interaction and startup regressions remain protected.\n\nExecutable head `0398a2a49d84e6067f7610727aecacf4c05fe41f` finished **42/42 associated workflow runs successfully** and all **15 required exact-head contexts** were green, including `verify/performance-architecture` and `verify/pages-deploy`.')
          replace(path,
              '**Phase 1B Item Freshness / Spoilage remains frozen until this gate has a green exact-head executable and human phone/Safari testing confirms ordinary movement no longer has unacceptable stalls.**',
              '**The CI/executable half of this gate is complete. Phase 1B Item Freshness / Spoilage remains frozen only until human phone/Safari testing confirms ordinary movement no longer has unacceptable stalls.**')

          # Current context.
          path = 'README_CONTEXT.md'
          replace(path,
              '- **29 World Interaction Affordance / Reach** — **IMPLEMENTED — Candidate 001**, Roadmap Phase 1A.\n',
              '- **29 World Interaction Affordance / Reach** — **IMPLEMENTED — Candidate 001**, Roadmap Phase 1A.\n- **Performance Architecture Gate** — **IMPLEMENTED + CI VERIFIED — P0/P1/P2**: domain-specific WHAT revisions, explicit bulk-change summaries, streaming notification batching, dependency-correct lighting/shelter invalidation, coalesced perception/interaction wakeups and live DEV telemetry.\n')
          replace(path,
              '**Current next step: DESCRIBE Phase 1B / item freshness-spoilage. 1B implementation is not pre-authorized merely because 1A is complete.**',
              '**Current gate: human iPhone/Safari acceptance of the performance build. After that acceptance, the next bounded work is DESCRIBE Phase 1B / item freshness-spoilage. 1B implementation is not pre-authorized merely because 1A and the CI performance gate are complete.**')
          marker = '---\n\n## Physical-survival correction\n'
          section = '''---

## Current performance architecture truth

> **A world mutation may update truth many times; expensive consumers wake only for the domains and completed batches they actually depend on.**

The first P0/P1/P2 performance gate is implemented. WHAT retains its global authoritative revision and now also exposes terrain and per-placement-channel revisions plus explicit compact `WorldChangeBatch` summaries. System 00F brackets its existing rollback-safe multi-source materialization transaction with that notification batch.

System 27 physical geometry and Weather sky exposure now key to terrain + STRUCTURE truth rather than every global WHAT mutation. ACTOR and ordinary OBJECT churn therefore cannot invalidate static lighting/shelter geometry. Systems 23 and 29 coalesce explicit streaming batches into one locally relevant refresh decision, and System 24 suppresses intermediate interaction-provider broadcasts during the same batch. Lighting presentation likewise ignores unrelated actor/object mutations.

The canonical DEV renderer exposes low-overhead performance telemetry for streaming, lighting simulation/presentation, perception, interaction, Weather drawing and sky exposure. This instrumentation is observation only and never changes simulation behavior.

First fully green executable head: `0398a2a49d84e6067f7610727aecacf4c05fe41f`. All **42 associated workflow runs** completed successfully and all **15 required exact-head contexts** were green on that SHA. Exact performance context: `verify/performance-architecture`.

The remaining acceptance step is a human iPhone/Safari playtest. GPU Weather and predictive/amortized streaming remain measured follow-ups only if that playtest or telemetry still shows a meaningful bottleneck.

---

## Physical-survival correction
'''
          replace(path, marker, section)
          replace(path,
              '- `verify/system29-interaction-affordance`\n- `verify/pages-deploy`\n\nAll 14 were green on executable head `5b88d9172df51561ea760913873f62bd2cdc422a`.',
              '- `verify/system29-interaction-affordance`\n- `verify/performance-architecture`\n- `verify/pages-deploy`\n\nAll **15 required contexts** were green on performance-gate executable head `0398a2a49d84e6067f7610727aecacf4c05fe41f`; all **42 workflow runs** associated with that SHA completed successfully.')

          # Roadmap gate routing.
          path = 'ROADMAP.md'
          gate = '''### Performance architecture gate — IMPLEMENTED + CI VERIFIED

Before Phase 1B, the approved non-numbered P0/P1/P2 performance pass was implemented on exact executable head `0398a2a49d84e6067f7610727aecacf4c05fe41f`.

- WHAT now exposes cache-oriented terrain/per-channel placement revisions while preserving the global authoritative revision;
- explicit bulk materialization emits one compact completion summary while truth still mutates immediately;
- lighting and sky-exposure geometry no longer invalidate on ordinary ACTOR/OBJECT churn;
- perception, interaction and loot-provider wakeups coalesce explicit streaming batches;
- the live DEV renderer exposes compact performance telemetry;
- all **42 workflow runs** on the executable SHA completed successfully and all **15 required exact-head contexts** are green.

**Remaining gate before 1B implementation: human iPhone/Safari acceptance of ordinary movement/streaming feel.** GPU Weather and predictive/amortized streaming remain deferred unless measurement or that playtest justifies them.

### 1B — Item freshness / spoilage — NEXT DESIGN TARGET
'''
          replace(path, '### 1B — Item freshness / spoilage — NEXT DESIGN TARGET\n', gate)
          replace(path,
              '**Recommended next bounded design:** **1B Item freshness / spoilage.**',
              '**Recommended next bounded design after human phone/Safari performance acceptance:** **1B Item freshness / spoilage.**')
          replace(path,
              '- performance profiling before population-scale AI, many simultaneous observers, moving lights, vehicles or large utility damage graphs;',
              '- **first performance architecture gate COMPLETE:** P0/P1/P2 invalidation/batching/telemetry pass verified on `0398a2a49d84e6067f7610727aecacf4c05fe41f`; repeat profiling before population-scale AI, many simultaneous observers, moving lights, vehicles or large utility damage graphs;')

          # System design index / approval ledger.
          path = 'SYSTEM_DESIGNS/README.md'
          replace(path,
              '| 29 | World Interaction Affordance / Reach | **IMPLEMENTED — Candidate 001; Roadmap Phase 1A** | `29_WORLD_INTERACTION_AFFORDANCE_REACH.md` |\n| 00E |',
              '| 29 | World Interaction Affordance / Reach | **IMPLEMENTED — Candidate 001; Roadmap Phase 1A** | `29_WORLD_INTERACTION_AFFORDANCE_REACH.md` |\n| PERF | Performance Architecture Gate | **IMPLEMENTED + CI VERIFIED — P0/P1/P2** | `PERFORMANCE_ARCHITECTURE.md` |\n| 00E |')
          replace(path,
              '1A. **Interaction affordance + reach** — **COMPLETE: System 29 Candidate 001**, exact playable head `5b88d9172df51561ea760913873f62bd2cdc422a`.\n\n1B.',
              '1A. **Interaction affordance + reach** — **COMPLETE: System 29 Candidate 001**, exact playable head `5b88d9172df51561ea760913873f62bd2cdc422a`.\n\n**Performance Architecture Gate — IMPLEMENTED + CI VERIFIED:** exact executable head `0398a2a49d84e6067f7610727aecacf4c05fe41f`; 42/42 associated workflow runs successful and all 15 required contexts green. Human iPhone/Safari acceptance remains before Phase 1B implementation.\n\n1B.')
          marker = '---\n\n## Current world-generation / materialization truth\n'
          section = '''---

## Current performance architecture truth

The approved non-numbered P0/P1/P2 gate is implemented under the rule:

> **A world mutation may update truth many times; expensive consumers wake only for the domains and completed batches they actually depend on.**

WHAT now supplies terrain/per-placement-channel revisions and explicit compact bulk summaries without replacing the global authoritative revision. 00F owns the materialization batch boundary. System 27 lighting geometry and Weather sky exposure depend only on geometry-relevant domains; Systems 23/29 and the System-24 interaction provider coalesce explicit bulk-stream wakeups. A compact DEV panel exposes neutral performance telemetry.

First fully green executable head: `0398a2a49d84e6067f7610727aecacf4c05fe41f`. All **42 associated workflows** succeeded; all **15 required exact-head contexts** are green. Permanent context: `verify/performance-architecture`.

GPU Weather and predictive/amortized streaming are deferred measured follow-ups. Human iPhone/Safari acceptance is the final gate before Phase 1B implementation proceeds.

---

## Current world-generation / materialization truth
'''
          replace(path, marker, section)
          replace(path,
              '- `verify/system29-interaction-affordance`\n- `verify/pages-deploy`\n\nAll 14 are green on executable head `5b88d9172df51561ea760913873f62bd2cdc422a`.',
              '- `verify/system29-interaction-affordance`\n- `verify/performance-architecture`\n- `verify/pages-deploy`\n\nAll **15 required contexts** are green on performance-gate executable head `0398a2a49d84e6067f7610727aecacf4c05fe41f`; all **42 workflow runs** associated with that SHA completed successfully.')

          # Human-facing changelog: prepend newest entry after title.
          path = 'CHANGELOG.md'
          p = Path(path)
          text = p.read_text()
          header = '# Changelog\n\n'
          if not text.startswith(header):
              raise SystemExit('CHANGELOG.md header mismatch')
          entry = '''## Performance Architecture Gate — P0/P1/P2 — 2026-08-24

- Implemented the approved non-numbered performance gate before Phase 1B under the rule **“A world mutation may update truth many times; expensive consumers wake only for the domains and completed batches they actually depend on.”**
- Added cache-oriented WHAT terrain and per-placement-channel revisions while preserving the global authoritative world revision and existing low-level change contract.
- Added explicit `WorldChangeBatch` summaries for bulk work. System 00F now brackets its existing rollback-safe multi-source materialization transaction so authoritative truth still changes immediately while expensive consumers can wake once after completion.
- Corrected placement-change channel metadata so domain revisions genuinely advance for STRUCTURE/OBJECT/ACTOR changes.
- Removed the global-WHAT-revision coupling from System 27 geometry/sample invalidation. Static lighting geometry now keys to terrain + STRUCTURE placement; ordinary player movement and loot/object churn no longer rebuild the 80×96 field.
- Keyed Weather `SkyExposureQuery` to terrain + STRUCTURE revisions, so walking or ordinary loot changes no longer rebuild the roof/exterior precipitation mask.
- Coalesced explicit streaming-batch wakeups in System 23 perception, System 29 interaction affordances and System 24 searchable-container offer publication while preserving immediate behavior for ordinary non-batch actions.
- Updated physical-light presentation to redraw for visible terrain/STRUCTURE or real light-input changes rather than every WHAT change.
- Added low-overhead `PerformanceTelemetry` plus a compact 2 Hz DEV performance panel covering streaming, lighting simulation/presentation, perception, interaction, Weather drawing and sky-exposure work.
- Added permanent `verify/performance-architecture` coverage. The deterministic fixture proves **128 OBJECTs / 256 low-level changes -> one completed batch**, ACTOR/OBJECT churn -> **zero** lighting geometry/sample and shelter-mask rebuilds, and a real STRUCTURE mutation -> exactly one relevant rebuild.
- GPU Weather and predictive/amortized streaming were deliberately deferred until real post-P2 measurement justifies them.
- First fully green executable head: `0398a2a49d84e6067f7610727aecacf4c05fe41f`.
- On that exact SHA, **42/42 associated workflow runs completed successfully** and all **15 required exact-head contexts** were green, including `verify/performance-architecture` and `verify/pages-deploy`.
- CI implementation is closed. **Human iPhone/Safari movement/streaming acceptance remains the final performance gate before Phase 1B implementation.**

'''
          p.write_text(header + entry + text[len(header):])

          # This helper is staging-only and must not survive the docs commit.
          Path('.github/workflows/perf-docs-close.yml').unlink()
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Close performance architecture gate documentation"
          git push origin HEAD:perf-docs-close
