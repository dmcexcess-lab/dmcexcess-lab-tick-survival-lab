name: Slice 6 contextual interaction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slice6-contextual-interaction
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        run: ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Verify production contextual interaction route
        run: timeout 240s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/Slice6ContextualInteractionSmoke.gd
      - name: Guard contextual route from legacy execution
        shell: bash
        run: |
          ! grep -q 'TickKernel' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'TimedAction' game/scripts/player/SimpleTurnController.gd
          ! grep -q 'ScheduledEvent' game/scripts/player/SimpleTurnController.gd
          grep -q 'complete_contextual_action' game/scripts/player/SimpleTurnController.gd
          grep -q '_run_simple_contextual_action' game/scripts/app/TurnBasedGameMain.gd
          ! grep -A140 '_run_simple_contextual_action' game/scripts/app/TurnBasedGameMain.gd | grep -q 'run_until_stop'
          ! grep -A140 '_run_simple_contextual_action' game/scripts/app/TurnBasedGameMain.gd | grep -q 'begin_action'
          ! grep -q '\[node name="SessionControls"' game/gameplay.tscn
