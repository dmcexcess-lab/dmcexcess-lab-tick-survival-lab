name: Run and Damage-Interruptible Walking contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: run-damage-walking-contract
  cancel-in-progress: true

jobs:
  run-damage-walking:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 17 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/17_RUN_DAMAGE_INTERRUPTIBLE_WALKING.md
          test -f game/scripts/simulation/movement/MovementDamageInterruptionService.gd
          test -f game/scripts/simulation/movement/MovementExertionService.gd
          test -f game/scripts/ci/RunDamageWalkingSmoke.gd
          grep -q 'request_run_forward' game/scripts/simulation/movement/MovementActionService.gd
          grep -q 'RUN_STRIDE_1_PHASE' game/scripts/simulation/movement/MovementActionService.gd
          grep -q 'RUN_STRIDE_SCALE_BP: int = 6000' game/scripts/simulation/movement/MovementTraversalPolicy.gd
          grep -q 'RUN_MAX_START_FATIGUE_EXCLUSIVE: int = 80' game/scripts/simulation/actors/needs/ActorNeedsMobilityModifierProvider.gd
          grep -q 'damage_applied' game/scripts/simulation/actors/health/ActorHealthState.gd
          grep -q 'RUN_FORWARD' game/scripts/input/PlayerActionIntent.gd
          ! grep -q 'actors/health' game/scripts/simulation/movement/MovementActionService.gd
          ! grep -q 'actors/needs' game/scripts/simulation/movement/MovementActionService.gd
          ! grep -q 'actors/carry' game/scripts/simulation/movement/MovementActionService.gd
          ! grep -R -q 'is_running\|run_mode\|MODE_RUN' game/scripts/simulation/movement game/scripts/simulation/actors/locomotion game/scripts/player/PlayerActionController.gd

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Movement and locomotion regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/MovementActionsSmoke.gd | tee "$RUNNER_TEMP/movement.log"
          grep -q 'MOVEMENT_ACTIONS_SMOKE_OK' "$RUNNER_TEMP/movement.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorLocomotionSmoke.gd | tee "$RUNNER_TEMP/locomotion.log"
          grep -q 'ACTOR_LOCOMOTION_SMOKE_OK' "$RUNNER_TEMP/locomotion.log"

      - name: Health needs carry regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorHealthSmoke.gd | tee "$RUNNER_TEMP/health.log"
          grep -q 'ACTOR_HEALTH_SMOKE_OK' "$RUNNER_TEMP/health.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorNeedsSmoke.gd | tee "$RUNNER_TEMP/needs.log"
          grep -q 'ACTOR_NEEDS_SMOKE_OK' "$RUNNER_TEMP/needs.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ActorCarrySmoke.gd | tee "$RUNNER_TEMP/carry.log"
          grep -q 'ACTOR_CARRY_SMOKE_OK' "$RUNNER_TEMP/carry.log"

      - name: System 17 regression smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/RunDamageWalkingSmoke.gd 2>&1 | tee "$RUNNER_TEMP/system17.log"
          grep -q 'RUN_DAMAGE_WALKING_SMOKE_OK' "$RUNNER_TEMP/system17.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/system17.log"; then exit 1; fi

      - name: Canonical demo shell regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalDemoSmoke.gd | tee "$RUNNER_TEMP/demo.log"
          grep -q 'CANONICAL_DEMO_SMOKE_OK' "$RUNNER_TEMP/demo.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalHudSmoke.gd | tee "$RUNNER_TEMP/hud.log"
          grep -q 'CANONICAL_HUD_SMOKE_OK' "$RUNNER_TEMP/hud.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/CanonicalPlayerShellSmoke.gd | tee "$RUNNER_TEMP/shell.log"
          grep -q 'CANONICAL_PLAYER_SHELL_SMOKE_OK' "$RUNNER_TEMP/shell.log"

      - name: Canonical demo startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
