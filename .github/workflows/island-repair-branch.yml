name: Island Repair Branch

on:
  push:
    branches: [repair/island-seam-safe]

permissions:
  contents: read

concurrency:
  group: island-repair-branch
  cancel-in-progress: true

jobs:
  island-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Probe island seam geometry
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/IslandRepairProbe.gd 2>&1 | tee "$RUNNER_TEMP/island-repair-probe.log"

      - name: Verify island legacy seam
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/IslandLegacySeamSmoke.gd 2>&1 | tee "$RUNNER_TEMP/island-legacy-seam.log"

      - name: Preserve branch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-repair-${{ github.sha }}
          path: |
            ${{ runner.temp }}/island-repair-probe.log
            ${{ runner.temp }}/island-legacy-seam.log
          if-no-files-found: ignore
          retention-days: 7
