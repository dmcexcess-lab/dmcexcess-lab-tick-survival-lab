name: One-shot mobile zoom patcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[zoom-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply presentation-only zoom patch
        shell: python
        run: |
          from pathlib import Path

          p = Path('game/scripts/MapPreview.gd')
          s = p.read_text()

          s = s.replace(
              'const TILE := 28.0\nconst BOARD_X := 40.0\nconst TOP := 132.0',
              'const TILE := 31.0\nconst VISIBLE_COLS := 18\nconst VISIBLE_ROWS := 16\nconst BOARD_X := 41.0\nconst TOP := 132.0'
          )

          s = s.replace(
              '    var board_rect := Rect2(BOARD_X, TOP, float(MapGen.BOARD_W) * TILE, float(MapGen.BOARD_H) * TILE)\n    if not board_rect.has_point(pos):',
              '    var board_rect: Rect2 = _visible_board_rect()\n    if not board_rect.has_point(pos):'
          )

          old_map = '''func _draw_map_tiles() -> void:\n    var theme: String = MapGen.theme_name(environment_id)\n    for y in range(MapGen.BOARD_H):\n        for x in range(MapGen.BOARD_W):\n            var p := Vector2i(x, y)\n            Tiles.draw_ground(self, _cell_rect(p), MapGen.ground_at(spec, p))\n    for p_value in spec.get("walls", []):\n        Tiles.draw_wall(self, _cell_rect(p_value), theme)\n    for door_value in world.doors.keys():\n        var p: Vector2i = door_value\n        Tiles.draw_door(self, _cell_rect(p), world.is_door_open(p))\n    for p_value in spec.get("glass", []):\n        Tiles.draw_window(self, _cell_rect(p_value))\n    for entry_value in spec.get("props", []):\n        var entry: Array = entry_value\n        Tiles.draw_prop(self, _cell_rect(entry[0]), str(entry[1]))\n    for p_value in spec.get("barrels", []):\n        Tiles.draw_barrel(self, _cell_rect(p_value))\n    for exit_value in spec.get("exit_cells", []):\n        draw_rect(_cell_rect(exit_value).grow(-3), Color("55d56e"), false, 2.0)\n'''
          new_map = '''func _draw_map_tiles() -> void:\n    var theme: String = MapGen.theme_name(environment_id)\n    var origin: Vector2i = _view_origin()\n    for y in range(origin.y, origin.y + VISIBLE_ROWS):\n        for x in range(origin.x, origin.x + VISIBLE_COLS):\n            var p := Vector2i(x, y)\n            Tiles.draw_ground(self, _cell_rect(p), MapGen.ground_at(spec, p))\n    for p_value in spec.get("walls", []):\n        if _cell_on_screen(p_value):\n            Tiles.draw_wall(self, _cell_rect(p_value), theme)\n    for door_value in world.doors.keys():\n        var p: Vector2i = door_value\n        if _cell_on_screen(p):\n            Tiles.draw_door(self, _cell_rect(p), world.is_door_open(p))\n    for p_value in spec.get("glass", []):\n        if _cell_on_screen(p_value):\n            Tiles.draw_window(self, _cell_rect(p_value))\n    for entry_value in spec.get("props", []):\n        var entry: Array = entry_value\n        if _cell_on_screen(entry[0]):\n            Tiles.draw_prop(self, _cell_rect(entry[0]), str(entry[1]))\n    for p_value in spec.get("barrels", []):\n        if _cell_on_screen(p_value):\n            Tiles.draw_barrel(self, _cell_rect(p_value))\n    for exit_value in spec.get("exit_cells", []):\n        if _cell_on_screen(exit_value):\n            draw_rect(_cell_rect(exit_value).grow(-3), Color("55d56e"), false, 2.0)\n    draw_rect(_visible_board_rect(), Color("6c7772"), false, 1.0)\n'''
          if old_map not in s:
              raise SystemExit('map draw block not found')
          s = s.replace(old_map, new_map)

          old_light = '''func _draw_lighting() -> void:\n    var dark_tint: Color = Lighting.ambient_tint(MapGen.theme_name(environment_id), scene_time)\n    for y in range(MapGen.BOARD_H):\n        for x in range(MapGen.BOARD_W):\n            var cell := Vector2i(x, y)\n            var level: float = float(light_levels.get(cell, 0.0))\n            var darkness: float = Lighting.darkness_alpha(level)\n            draw_rect(_cell_rect(cell), Color(dark_tint.r, dark_tint.g, dark_tint.b, darkness))\n            if light_tints.has(cell):\n                var tint := Color(str(light_tints[cell]))\n                var wash: float = Lighting.color_wash_alpha(level)\n                if wash > 0.0:\n                    draw_rect(_cell_rect(cell).grow(-1), Color(tint.r, tint.g, tint.b, wash))\n'''
          new_light = '''func _draw_lighting() -> void:\n    var dark_tint: Color = Lighting.ambient_tint(MapGen.theme_name(environment_id), scene_time)\n    var origin: Vector2i = _view_origin()\n    for y in range(origin.y, origin.y + VISIBLE_ROWS):\n        for x in range(origin.x, origin.x + VISIBLE_COLS):\n            var cell := Vector2i(x, y)\n            var level: float = float(light_levels.get(cell, 0.0))\n            var darkness: float = Lighting.darkness_alpha(level)\n            draw_rect(_cell_rect(cell), Color(dark_tint.r, dark_tint.g, dark_tint.b, darkness))\n            if light_tints.has(cell):\n                var tint := Color(str(light_tints[cell]))\n                var wash: float = Lighting.color_wash_alpha(level)\n                if wash > 0.0:\n                    draw_rect(_cell_rect(cell).grow(-1), Color(tint.r, tint.g, tint.b, wash))\n'''
          if old_light not in s:
              raise SystemExit('lighting block not found')
          s = s.replace(old_light, new_light)

          s = s.replace(
              '        if p.x < 0:\n            continue\n        var c: Vector2 = _cell_center(p)',
              '        if p.x < 0 or not _cell_on_screen(p):\n            continue\n        var c: Vector2 = _cell_center(p)'
          )

          s = s.replace(
              'func _draw_player() -> void:\n    Tiles.draw_player(self, _cell_rect(player.cell).grow(-1), player.facing)\n    draw_rect(_cell_rect(player.cell).grow(-2), Color("65cfff"), false, 1.5)',
              'func _draw_player() -> void:\n    if not _cell_on_screen(player.cell):\n        return\n    Tiles.draw_player(self, _cell_rect(player.cell).grow(-1), player.facing)\n    draw_rect(_cell_rect(player.cell).grow(-2), Color("65cfff"), false, 1.5)'
          )

          old_fog = '''func _draw_fog() -> void:\n    for y in range(MapGen.BOARD_H):\n        for x in range(MapGen.BOARD_W):\n            var p := Vector2i(x, y)\n            if visible_cells.has(p):\n                continue\n            var alpha: float = 0.62 if memory.has(p) else 0.96\n            draw_rect(_cell_rect(p), Color(0.005, 0.008, 0.010, alpha))\n'''
          new_fog = '''func _draw_fog() -> void:\n    var origin: Vector2i = _view_origin()\n    for y in range(origin.y, origin.y + VISIBLE_ROWS):\n        for x in range(origin.x, origin.x + VISIBLE_COLS):\n            var p := Vector2i(x, y)\n            if visible_cells.has(p):\n                continue\n            var alpha: float = 0.62 if memory.has(p) else 0.96\n            draw_rect(_cell_rect(p), Color(0.005, 0.008, 0.010, alpha))\n'''
          if old_fog not in s:
              raise SystemExit('fog block not found')
          s = s.replace(old_fog, new_fog)

          s = s.replace(
              'func _screen_to_cell(pos: Vector2) -> Vector2i:\n    return Vector2i(int(floor((pos.x - BOARD_X) / TILE)), int(floor((pos.y - TOP) / TILE)))',
              'func _screen_to_cell(pos: Vector2) -> Vector2i:\n    var origin: Vector2i = _view_origin()\n    return origin + Vector2i(int(floor((pos.x - BOARD_X) / TILE)), int(floor((pos.y - TOP) / TILE)))'
          )

          s = s.replace(
              '    var board := Rect2(BOARD_X, TOP, float(MapGen.BOARD_W) * TILE, float(MapGen.BOARD_H) * TILE)',
              '    var board: Rect2 = _visible_board_rect()'
          )

          s = s.replace(
              '        for y in range(MapGen.BOARD_H):\n            for x in range(MapGen.BOARD_W):\n                var cell := Vector2i(x, y)\n                if not _weather_cell_allowed(cell):',
              '        var origin: Vector2i = _view_origin()\n        for y in range(origin.y, origin.y + VISIBLE_ROWS):\n            for x in range(origin.x, origin.x + VISIBLE_COLS):\n                var cell := Vector2i(x, y)\n                if not _weather_cell_allowed(cell):',
              1
          )

          # Storm flash has its own full-board loop later in the function.
          s = s.replace(
              '            for y in range(MapGen.BOARD_H):\n                for x in range(MapGen.BOARD_W):\n                    var cell := Vector2i(x, y)\n                    if _weather_cell_allowed(cell):',
              '            var origin: Vector2i = _view_origin()\n            for y in range(origin.y, origin.y + VISIBLE_ROWS):\n                for x in range(origin.x, origin.x + VISIBLE_COLS):\n                    var cell := Vector2i(x, y)\n                    if _weather_cell_allowed(cell):'
          )

          old_tail = '''func _cell_rect(p: Vector2i) -> Rect2:\n    return Rect2(BOARD_X + float(p.x) * TILE, TOP + float(p.y) * TILE, TILE, TILE)\n\nfunc _cell_center(p: Vector2i) -> Vector2:\n    return Vector2(BOARD_X + (float(p.x) + 0.5) * TILE, TOP + (float(p.y) + 0.5) * TILE)\n'''
          new_tail = '''func _view_origin() -> Vector2i:\n    var max_x: int = maxi(0, MapGen.BOARD_W - VISIBLE_COLS)\n    var max_y: int = maxi(0, MapGen.BOARD_H - VISIBLE_ROWS)\n    var x: int = clampi(player.cell.x - VISIBLE_COLS / 2, 0, max_x)\n    var y: int = clampi(player.cell.y - VISIBLE_ROWS / 2, 0, max_y)\n    return Vector2i(x, y)\n\nfunc _cell_on_screen(p: Vector2i) -> bool:\n    var origin: Vector2i = _view_origin()\n    return p.x >= origin.x and p.y >= origin.y and p.x < origin.x + VISIBLE_COLS and p.y < origin.y + VISIBLE_ROWS\n\nfunc _visible_board_rect() -> Rect2:\n    return Rect2(BOARD_X, TOP, float(VISIBLE_COLS) * TILE, float(VISIBLE_ROWS) * TILE)\n\nfunc _cell_rect(p: Vector2i) -> Rect2:\n    var origin: Vector2i = _view_origin()\n    return Rect2(BOARD_X + float(p.x - origin.x) * TILE, TOP + float(p.y - origin.y) * TILE, TILE, TILE)\n\nfunc _cell_center(p: Vector2i) -> Vector2:\n    var origin: Vector2i = _view_origin()\n    return Vector2(BOARD_X + (float(p.x - origin.x) + 0.5) * TILE, TOP + (float(p.y - origin.y) + 0.5) * TILE)\n'''
          if old_tail not in s:
              raise SystemExit('cell helper tail not found')
          s = s.replace(old_tail, new_tail)

          p.write_text(s)

          c = Path('README_CONTEXT.md')
          cs = c.read_text()
          marker = 'The current clock harness uses 600 world ticks per displayed in-game minute as a provisional presentation mapping. This is not yet a final global calendar-speed design promise.'
          replacement = marker + '\n\nClock design direction: keep the authoritative action tick as a fine physical-opportunity unit (roughly second-scale for action intuition), but allow calendar/day progression to use a separate fixed compression factor. Do not force one action tick to equal one displayed game second; the final calendar multiplier should be tuned once infected timing and body needs are playable.'
          if marker in cs and 'Clock design direction:' not in cs:
              cs = cs.replace(marker, replacement)
          c.write_text(cs)

          ch = Path('CHANGELOG.md')
          text = ch.read_text()
          entry = '''## Mobile Map Zoom / Clock Direction — 2026-08-14\n\n- Increased tactical tile presentation from 28px to 31px for better mobile readability.\n- Added an 18×16 player-following presentation window over the unchanged 20×18 physical map; the camera crops the outer ring but shifts near edges so exits and edge tiles remain reachable.\n- Updated map tapping, weather particles, fog, lighting, props and light glows to use the cropped camera coordinates without changing simulation/world coordinates.\n- Kept the current calendar-speed constant provisional; documented that action ticks and displayed calendar progression should be separate concepts so combat timing can stay second-scale while days remain playable.\n\n'''
          if '## Mobile Map Zoom / Clock Direction' not in text:
              text = text.replace('# Changelog\n\n', '# Changelog\n\n' + entry)
          ch.write_text(text)
      - name: Commit patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "dmcexcess-lab"
          git config user.email "dmcexcess@gmail.com"
          git add game/scripts/MapPreview.gd README_CONTEXT.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Zoom mobile tactical viewport [zoom-patched]"
          git push origin HEAD:main
