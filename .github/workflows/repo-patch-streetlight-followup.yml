name: Apply Streetlight Followup Patch

on:
  push:
    paths:
      - '.github/workflows/repo-patch-streetlight-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted production patch
        run: |
          python3 tools/apply_streetlight_followup.py
          git diff --check
          git diff -- game/scripts/simulation/utilities/NeighborhoodPowerInfrastructureMaterializer.gd
      - name: Commit production repair
        run: |
          git config user.name 'dmcexcess-lab'
          git config user.email 'dmcexcess@gmail.com'
          git add game/scripts/simulation/utilities/NeighborhoodPowerInfrastructureMaterializer.gd
          git commit -m 'fix: reuse and space auxiliary roadside supports'
          git push origin HEAD:main
