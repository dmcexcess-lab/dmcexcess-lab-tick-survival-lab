name: Phase 2 canonical fear

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
      - name: Build script class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit
      - name: Check fear-touched script chain
        shell: bash
        run: |
          set -euxo pipefail
          for script in \
            res://scripts/simulation/actors/condition/ActorFearPressureService.gd \
            res://scripts/simulation/actors/locomotion/ActorPhysicalContestQuery.gd \
            res://scripts/simulation/combat/FirearmActionService.gd \
            res://scripts/app/System34GameMain.gd \
            res://scripts/app/CombatGameMain.gd
          do
            ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --check-only --script "$script"
          done
      - name: Verify canonical fear
        shell: bash
        run: |
          set -euxo pipefail
          timeout 180s ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" -s res://scripts/ci/Phase2FearSmoke.gd
