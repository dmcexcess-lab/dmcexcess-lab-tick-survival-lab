name: Prompt Native Play Acceptance

on:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/prompt-native-play-acceptance.yml'
      - 'README_CONTEXT.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-play-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          curl -L -o templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.1.stable"
          unzip -q templates.tpz -d templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.1.stable/"

      - name: Prepare Godot project class cache
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit

      - name: Verify production startup for native play harness
        shell: bash
        run: |
          set -euxo pipefail
          timeout --kill-after=10s 120s stdbuf -oL -eL ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/PromptNativePlayAcceptanceSmoke.gd 2>&1 | tee "$RUNNER_TEMP/prompt-native-play-acceptance.log"
          grep -q 'PROMPT_NATIVE_PLAY_ACCEPTANCE_SMOKE: PASS' "$RUNNER_TEMP/prompt-native-play-acceptance.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/prompt-native-play-acceptance.log"; then exit 1; fi

      - name: Add temporary Linux export preset
        shell: bash
        run: |
          cat >> "$GITHUB_WORKSPACE/game/export_presets.cfg" <<'EOF'

          [preset.1]

          name="Linux"
          platform="Linux"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="../build/native/tick-survival-lab.x86_64"
          script_export_mode=2

          [preset.1.options]

          custom_template/debug=""
          custom_template/release=""
          debug/export_console_wrapper=1
          binary_format/embed_pck=true
          texture_format/s3tc_bptc=true
          texture_format/etc2_astc=false
          binary_format/architecture="x86_64"
          EOF

      - name: Export native Linux play build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/native"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --export-release Linux "$GITHUB_WORKSPACE/build/native/tick-survival-lab.x86_64"
          chmod +x "$GITHUB_WORKSPACE/build/native/tick-survival-lab.x86_64"

      - name: Upload native play artifact
        uses: actions/upload-artifact@v4
        with:
          name: tick-native-play
          path: build/native/tick-survival-lab.x86_64
          retention-days: 1
