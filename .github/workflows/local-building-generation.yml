name: Local Building Generation and Archetype Lab contract

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-building-generation-contract
  cancel-in-progress: true

jobs:
  local-building-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate System 19 boundaries
        shell: bash
        run: |
          set -euxo pipefail
          test -f SYSTEM_DESIGNS/19_LOCAL_BUILDING_GENERATION_ARCHETYPE_LAB.md
          test -f game/scripts/generation/buildings/BuildingGenerationRequest.gd
          test -f game/scripts/generation/buildings/GeneratedBuildingPlan.gd
          test -f game/scripts/generation/buildings/LocalBuildingGenerator.gd
          test -f game/scripts/generation/buildings/GeneratedBuildingValidator.gd
          test -f game/scripts/generation/buildings/GeneratedBuildingMaterializer.gd
          test -f game/scripts/generation/buildings/BuildingArchetypePlacementDescriptor.gd
          test -f game/scripts/generation/buildings/grammar/BuildingGrammarProfile.gd
          test -f game/scripts/generation/buildings/grammar/BuildingGrammarGenerator.gd
          test -f game/scripts/generation/buildings/grammar/BuildingRoomDressingPlanner.gd
          test -f game/scripts/generation/buildings/grammar/BuildingGrammarQualityValidator.gd
          test -f game/scripts/generation/buildings/grammar/OneStoryProfileBuildingGenerator.gd
          test -f game/scripts/generation/buildings/profiles/RuralDinerBuildingProfile.gd
          test -f game/scripts/generation/buildings/profiles/OneStoryBaselineProfileCatalog.gd
          test -f game/scripts/generation/buildings/archetypes/TrailerBuildingGenerator.gd
          test -f game/scripts/generation/buildings/archetypes/FarmhouseBuildingGenerator.gd
          test -f game/scripts/generation/buildings/archetypes/RuralDinerBuildingGenerator.gd
          test -f game/scripts/demo/TrailerCritiqueFixture.gd
          test -f game/scripts/demo/FarmhouseCritiqueFixture.gd
          test -f game/scripts/demo/RuralDinerCritiqueFixture.gd
          test -f game/scripts/demo/BuildingGrammarDevSeedSession.gd
          test -f game/scripts/ui/BuildingGrammarDevControls.gd
          test -f game/scripts/ci/LocalBuildingGenerationSmoke.gd
          test -f game/scripts/ci/BuildingGrammarSmoke.gd
          ! grep -R -q 'assets/\|atlas_index\|Texture2D\|Camera2D' game/scripts/generation/buildings
          ! grep -R -q 'inventory\|loot\|infected' game/scripts/generation/buildings

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euxo pipefail
          curl -L -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64

      - name: Import and parse project
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --editor --path "$GITHUB_WORKSPACE/game" --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/import.log"; then exit 1; fi

      - name: Foundation and presentation regressions
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/SpatialModelSmoke.gd | tee "$RUNNER_TEMP/spatial.log"
          grep -q 'SPATIAL_MODEL_SMOKE_OK' "$RUNNER_TEMP/spatial.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/WorldStateSmoke.gd | tee "$RUNNER_TEMP/world.log"
          grep -q 'WORLD_STATE_SMOKE_OK' "$RUNNER_TEMP/world.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/ArtCatalogSmoke.gd | tee "$RUNNER_TEMP/art.log"
          grep -q 'ART_CATALOG_SMOKE_OK' "$RUNNER_TEMP/art.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --script res://scripts/ci/DoorStateSmoke.gd | tee "$RUNNER_TEMP/doorstate.log"
          grep -q 'DOOR_STATE_SMOKE_OK' "$RUNNER_TEMP/doorstate.log"

      - name: Systems 18 and 19 integration smokes
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 10 --script res://scripts/ci/DoorInteractionSmoke.gd 2>&1 | tee "$RUNNER_TEMP/door18.log"
          grep -q 'DOOR_INTERACTION_SMOKE_OK' "$RUNNER_TEMP/door18.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/LocalBuildingGenerationSmoke.gd 2>&1 | tee "$RUNNER_TEMP/building19.log"
          grep -q 'LOCAL_BUILDING_GENERATION_SMOKE_OK' "$RUNNER_TEMP/building19.log"
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 30 --script res://scripts/ci/BuildingGrammarSmoke.gd 2>&1 | tee "$RUNNER_TEMP/buildinggrammar.log"
          grep -q 'BUILDING_GRAMMAR_SMOKE_OK' "$RUNNER_TEMP/buildinggrammar.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script' "$RUNNER_TEMP/door18.log" "$RUNNER_TEMP/building19.log" "$RUNNER_TEMP/buildinggrammar.log"; then exit 1; fi

      - name: Canonical demo startup smoke
        shell: bash
        run: |
          set -euxo pipefail
          ./Godot_v4.7.1-stable_linux.x86_64 --headless --path "$GITHUB_WORKSPACE/game" --quit-after 2 2>&1 | tee "$RUNNER_TEMP/startup.log"
          grep -q 'CANONICAL_DEMO_BOOT_OK' "$RUNNER_TEMP/startup.log"
          if grep -Eqi 'SCRIPT ERROR|Parse Error|Failed to load script|CANONICAL_DEMO_BOOT_FAILED' "$RUNNER_TEMP/startup.log"; then exit 1; fi
