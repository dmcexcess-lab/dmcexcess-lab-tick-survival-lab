<svg xmlns="http://www.w3.org/2000/svg" width="128" height="32" viewBox="0 0 128 32" shape-rendering="crispEdges">
  <defs>
    <g id="front">
      <ellipse cx="16" cy="27" rx="9" ry="3" fill="#000" opacity=".35"/>
      <rect x="10" y="21" width="5" height="7" fill="#253039"/>
      <rect x="17" y="21" width="5" height="7" fill="#253039"/>
      <rect x="8" y="12" width="16" height="10" rx="2" fill="#334f65" stroke="#11191c" stroke-width="1"/>
      <rect x="5" y="14" width="4" height="7" fill="#d4a17d"/>
      <rect x="23" y="14" width="4" height="7" fill="#d4a17d"/>
      <circle cx="16" cy="8" r="5" fill="#2a2019"/>
      <circle cx="16" cy="9" r="4" fill="#d4a17d"/>
      <rect x="12" y="4" width="8" height="3" fill="#2a2019"/>
      <rect x="14" y="13" width="4" height="3" fill="#d7a33d"/>
      <rect x="13" y="8" width="2" height="1" fill="#28231f"/>
      <rect x="17" y="8" width="2" height="1" fill="#28231f"/>
    </g>
    <g id="back">
      <ellipse cx="16" cy="27" rx="9" ry="3" fill="#000" opacity=".35"/>
      <rect x="10" y="21" width="5" height="7" fill="#253039"/>
      <rect x="17" y="21" width="5" height="7" fill="#253039"/>
      <rect x="8" y="12" width="16" height="10" rx="2" fill="#2d4659" stroke="#11191c" stroke-width="1"/>
      <rect x="5" y="14" width="4" height="7" fill="#d4a17d"/>
      <rect x="23" y="14" width="4" height="7" fill="#d4a17d"/>
      <circle cx="16" cy="8" r="5" fill="#2a2019"/>
      <rect x="11" y="6" width="10" height="5" rx="2" fill="#2a2019"/>
      <rect x="11" y="13" width="10" height="2" fill="#263b4c"/>
      <rect x="14" y="17" width="4" height="3" fill="#223643"/>
    </g>
    <g id="side">
      <ellipse cx="16" cy="27" rx="8" ry="3" fill="#000" opacity=".35"/>
      <rect x="12" y="21" width="4" height="7" fill="#253039"/>
      <rect x="17" y="22" width="5" height="6" fill="#253039"/>
      <path d="M10 13h11l3 8H11z" fill="#334f65" stroke="#11191c" stroke-width="1"/>
      <rect x="20" y="14" width="6" height="4" fill="#d4a17d"/>
      <rect x="8" y="15" width="4" height="6" fill="#d4a17d"/>
      <circle cx="18" cy="8" r="5" fill="#2a2019"/>
      <path d="M15 6h7v6h-6l-2-3z" fill="#d4a17d"/>
      <rect x="14" y="4" width="8" height="3" fill="#2a2019"/>
      <rect x="21" y="8" width="2" height="1" fill="#28231f"/>
      <rect x="18" y="13" width="3" height="3" fill="#d7a33d"/>
    </g>
  </defs>
  <!-- 0 south/front -->
  <g transform="translate(0 0)"><use href="#front"/></g>
  <!-- 1 west profile; feet remain at bottom -->
  <g transform="translate(32 0)"><use href="#side"/></g>
  <!-- 2 north/back -->
  <g transform="translate(64 0)"><use href="#back"/></g>
  <!-- 3 east profile mirrored horizontally only; never rotated -->
  <g transform="translate(128 0) scale(-1 1)"><use href="#side"/></g>
</svg>
