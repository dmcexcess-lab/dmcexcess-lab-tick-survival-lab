<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <ellipse cx="16" cy="28" rx="8" ry="3" fill="#000" opacity=".35"/>
  <!-- legs stay planted south/down while hips and torso turn fully west -->
  <rect x="13" y="21" width="4" height="7" fill="#253039"/>
  <rect x="18" y="22" width="4" height="6" fill="#1f2930"/>
  <!-- narrow side-on torso / shoulder line -->
  <path d="M13 12h8l2 3-2 8h-9l-1-7z" fill="#334f65" stroke="#11191c" stroke-width="1"/>
  <path d="M13 14h8" stroke="#46657c" stroke-width="1"/>
  <!-- rear arm hangs behind, lead arm projects west -->
  <rect x="20" y="14" width="3" height="7" fill="#c89370"/>
  <path d="M13 14H8v3H5v4h4v-3h5z" fill="#d4a17d" stroke="#11191c" stroke-width="1"/>
  <!-- true west-facing head/profile -->
  <circle cx="14" cy="8" r="5" fill="#2a2019"/>
  <path d="M11 5h6v2h2v4h-3v2h-5l-3-3V7z" fill="#d4a17d"/>
  <rect x="10" y="4" width="8" height="3" fill="#2a2019"/>
  <rect x="8" y="8" width="2" height="1" fill="#28231f"/>
  <rect x="11" y="13" width="3" height="3" fill="#d7a33d"/>
</svg>