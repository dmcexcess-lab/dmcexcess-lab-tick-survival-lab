<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <ellipse cx="16" cy="28" rx="8" ry="3" fill="#000" opacity=".35"/>
  <!-- legs stay planted south/down while hips and torso turn fully east -->
  <rect x="15" y="21" width="4" height="7" fill="#253039"/>
  <rect x="10" y="22" width="4" height="6" fill="#1f2930"/>
  <!-- narrow side-on torso / shoulder line -->
  <path d="M11 15l2-3h8l2 4-1 7h-9z" fill="#334f65" stroke="#11191c" stroke-width="1"/>
  <path d="M13 14h8" stroke="#46657c" stroke-width="1"/>
  <!-- rear arm hangs behind, lead arm projects east -->
  <rect x="9" y="14" width="3" height="7" fill="#c89370"/>
  <path d="M20 14h4v3h3v4h-4v-3h-4z" fill="#d4a17d" stroke="#11191c" stroke-width="1"/>
  <!-- true east-facing head/profile -->
  <circle cx="18" cy="8" r="5" fill="#2a2019"/>
  <path d="M15 5h6l3 2v3l-3 3h-5v-2h-3V7h2z" fill="#d4a17d"/>
  <rect x="14" y="4" width="8" height="3" fill="#2a2019"/>
  <rect x="22" y="8" width="2" height="1" fill="#28231f"/>
  <rect x="18" y="13" width="3" height="3" fill="#d7a33d"/>
</svg>