<svg xmlns="http://www.w3.org/2000/svg" width="512" height="32" viewBox="0 0 512 32" shape-rendering="crispEdges">
  <defs>
    <pattern id="ocean" width="16" height="8" patternUnits="userSpaceOnUse">
      <rect width="16" height="8" fill="#173d5a"/>
      <rect x="1" y="2" width="6" height="2" fill="#245d78"/>
      <rect x="10" y="5" width="5" height="1" fill="#2c6c86"/>
    </pattern>
    <pattern id="river" width="12" height="8" patternUnits="userSpaceOnUse">
      <rect width="12" height="8" fill="#1c4c68"/>
      <rect x="0" y="2" width="5" height="1" fill="#34758d"/>
      <rect x="7" y="5" width="4" height="1" fill="#2d6880"/>
    </pattern>
    <pattern id="sand" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#b9a36a"/>
      <rect x="1" y="2" width="1" height="1" fill="#d1bd83"/>
      <rect x="5" y="5" width="1" height="1" fill="#8f8058"/>
    </pattern>
  </defs>

  <!-- 0 ocean -->
  <rect x="0" y="0" width="32" height="32" fill="url(#ocean)"/>
  <rect x="3" y="10" width="12" height="2" fill="#377e96"/>
  <rect x="18" y="22" width="10" height="2" fill="#2d6d85"/>

  <!-- 1 river -->
  <rect x="32" y="0" width="32" height="32" fill="url(#river)"/>
  <rect x="37" y="7" width="14" height="1" fill="#3b8197"/>
  <rect x="45" y="19" width="15" height="1" fill="#37798f"/>

  <!-- 2 plain shore sand -->
  <rect x="64" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="66" y="5" width="5" height="2" fill="#d8c68d"/>
  <rect x="84" y="21" width="7" height="2" fill="#9b8a5d"/>

  <!-- 3 north coast -->
  <rect x="96" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="96" y="0" width="32" height="10" fill="url(#ocean)"/>
  <rect x="96" y="10" width="32" height="3" fill="#d8c68d"/>
  <rect x="100" y="9" width="7" height="2" fill="#85afad"/>
  <rect x="116" y="8" width="8" height="2" fill="#85afad"/>

  <!-- 4 east coast -->
  <rect x="128" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="150" y="0" width="10" height="32" fill="url(#ocean)"/>
  <rect x="147" y="0" width="3" height="32" fill="#d8c68d"/>
  <rect x="149" y="4" width="2" height="7" fill="#85afad"/>
  <rect x="148" y="19" width="2" height="8" fill="#85afad"/>

  <!-- 5 south coast -->
  <rect x="160" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="160" y="22" width="32" height="10" fill="url(#ocean)"/>
  <rect x="160" y="19" width="32" height="3" fill="#d8c68d"/>
  <rect x="164" y="21" width="8" height="2" fill="#85afad"/>
  <rect x="180" y="20" width="7" height="2" fill="#85afad"/>

  <!-- 6 west coast -->
  <rect x="192" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="192" y="0" width="10" height="32" fill="url(#ocean)"/>
  <rect x="202" y="0" width="3" height="32" fill="#d8c68d"/>
  <rect x="200" y="5" width="2" height="8" fill="#85afad"/>
  <rect x="201" y="21" width="2" height="6" fill="#85afad"/>

  <!-- 7 north-east corner -->
  <rect x="224" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="224" y="0" width="32" height="10" fill="url(#ocean)"/>
  <rect x="246" y="0" width="10" height="32" fill="url(#ocean)"/>
  <rect x="224" y="10" width="22" height="3" fill="#d8c68d"/>
  <rect x="243" y="10" width="3" height="22" fill="#d8c68d"/>
  <rect x="242" y="8" width="5" height="5" fill="#85afad"/>

  <!-- 8 east-south corner -->
  <rect x="256" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="278" y="0" width="10" height="32" fill="url(#ocean)"/>
  <rect x="256" y="22" width="32" height="10" fill="url(#ocean)"/>
  <rect x="275" y="0" width="3" height="22" fill="#d8c68d"/>
  <rect x="256" y="19" width="22" height="3" fill="#d8c68d"/>
  <rect x="274" y="19" width="5" height="5" fill="#85afad"/>

  <!-- 9 south-west corner -->
  <rect x="288" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="288" y="0" width="10" height="32" fill="url(#ocean)"/>
  <rect x="288" y="22" width="32" height="10" fill="url(#ocean)"/>
  <rect x="298" y="0" width="3" height="22" fill="#d8c68d"/>
  <rect x="298" y="19" width="22" height="3" fill="#d8c68d"/>
  <rect x="296" y="19" width="5" height="5" fill="#85afad"/>

  <!-- 10 west-north corner -->
  <rect x="320" y="0" width="32" height="32" fill="url(#sand)"/>
  <rect x="320" y="0" width="10" height="32" fill="url(#ocean)"/>
  <rect x="320" y="0" width="32" height="10" fill="url(#ocean)"/>
  <rect x="330" y="10" width="22" height="3" fill="#d8c68d"/>
  <rect x="330" y="10" width="3" height="22" fill="#d8c68d"/>
  <rect x="328" y="8" width="5" height="5" fill="#85afad"/>

  <!-- 11 north-east-south: land opens west -->
  <rect x="352" y="0" width="32" height="32" fill="url(#ocean)"/>
  <rect x="352" y="11" width="12" height="10" fill="url(#sand)"/>
  <rect x="364" y="11" width="3" height="10" fill="#d8c68d"/>
  <rect x="360" y="9" width="6" height="3" fill="#85afad"/>
  <rect x="360" y="20" width="6" height="3" fill="#85afad"/>

  <!-- 12 west-north-east: land opens south -->
  <rect x="384" y="0" width="32" height="32" fill="url(#ocean)"/>
  <rect x="395" y="16" width="10" height="16" fill="url(#sand)"/>
  <rect x="395" y="13" width="10" height="3" fill="#d8c68d"/>
  <rect x="393" y="14" width="14" height="3" fill="#85afad"/>

  <!-- 13 south-west-north: land opens east -->
  <rect x="416" y="0" width="32" height="32" fill="url(#ocean)"/>
  <rect x="436" y="11" width="12" height="10" fill="url(#sand)"/>
  <rect x="433" y="11" width="3" height="10" fill="#d8c68d"/>
  <rect x="434" y="9" width="6" height="3" fill="#85afad"/>
  <rect x="434" y="20" width="6" height="3" fill="#85afad"/>

  <!-- 14 east-south-west: land opens north -->
  <rect x="448" y="0" width="32" height="32" fill="url(#ocean)"/>
  <rect x="459" y="0" width="10" height="16" fill="url(#sand)"/>
  <rect x="459" y="16" width="10" height="3" fill="#d8c68d"/>
  <rect x="457" y="15" width="14" height="3" fill="#85afad"/>

  <!-- 15 tiny sand island / all sides water -->
  <rect x="480" y="0" width="32" height="32" fill="url(#ocean)"/>
  <rect x="489" y="9" width="14" height="14" fill="url(#sand)"/>
  <rect x="487" y="11" width="18" height="10" fill="#d8c68d"/>
  <rect x="490" y="8" width="12" height="2" fill="#85afad"/>
  <rect x="490" y="22" width="12" height="2" fill="#85afad"/>
</svg>
